<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Pen — Sign In</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0c1222;
      --card:     #141d2e;
      --border:   #1e2d45;
      --accent:   #4361ee;
      --accent-h: #3451d1;
      --accent-glow: rgba(67,97,238,0.18);
      --text:     #ffffff;
      --text-2:   #8899b4;
      --text-3:   #4a5568;
      --error:    #f87171;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 32px 32px;
      margin: 20px;
    }

    .logo-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 28px;
    }
    .logo-icon { color: var(--accent); }
    .logo-text { font-size: 22px; font-weight: 800; }

    .tabs {
      display: flex;
      background: var(--bg);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 26px;
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 8px;
      border-radius: 7px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-2);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .tab.active {
      background: var(--card);
      color: var(--text);
      font-weight: 600;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    .section { display: none; }
    .section.active { display: block; }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-2);
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="tel"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 14px;
      color: var(--text);
      font-family: inherit;
      outline: none;
      transition: border-color 0.18s, box-shadow 0.18s;
      margin-bottom: 16px;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    input::placeholder { color: var(--text-3); }

    .btn {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, opacity 0.15s;
    }
    .btn:hover { background: var(--accent-h); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .toggle-row {
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
      color: var(--text-2);
    }
    .toggle-link {
      color: var(--accent);
      cursor: pointer;
      font-weight: 600;
    }
    .toggle-link:hover { text-decoration: underline; }

    .error-msg {
      font-size: 13px;
      color: var(--error);
      margin-bottom: 14px;
      min-height: 18px;
    }

    /* OTP boxes */
    .otp-row {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      justify-content: center;
    }
    .otp-box {
      width: 46px;
      height: 52px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      color: var(--text);
      font-family: inherit;
      outline: none;
      transition: border-color 0.18s, box-shadow 0.18s;
      caret-color: transparent;
      margin-bottom: 0;
    }
    .otp-box:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .back-link {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-2);
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 20px;
    }
    .back-link:hover { color: var(--text); }

    /* Auth overlay */
    #auth-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }
    .auth-spin {
      width: 28px; height: 28px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #recaptcha-container { margin-bottom: 16px; }
  </style>
</head>
<body>

<div id="auth-overlay"><div class="auth-spin"></div></div>

<div class="card" id="login-card" style="display:none">
  <div class="logo-row">
    <svg class="logo-icon" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
      <path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"/>
      <line x1="16" y1="8" x2="2" y2="22"/>
      <line x1="17.5" y1="15" x2="9" y2="15"/>
    </svg>
    <span class="logo-text">AI Pen</span>
  </div>

  <div class="tabs">
    <div class="tab active" id="tab-email" onclick="switchTab('email')">Email</div>
    <div class="tab" id="tab-phone" onclick="switchTab('phone')">Phone</div>
  </div>

  <!-- EMAIL SECTION -->
  <div class="section active" id="sec-email">
    <div class="error-msg" id="email-error"></div>
    <label>Email</label>
    <input type="email" id="email-input" placeholder="you@example.com" />
    <label>Password</label>
    <input type="password" id="pass-input" placeholder="••••••••" onkeydown="if(event.key==='Enter')emailAction()" />
    <button class="btn" id="email-btn" onclick="emailAction()">Sign In</button>
    <div class="toggle-row">
      <span id="toggle-hint">Don't have an account?</span>
      <span class="toggle-link" onclick="toggleMode()" id="toggle-link"> Sign Up</span>
    </div>
  </div>

  <!-- PHONE SECTION -->
  <div class="section" id="sec-phone">

    <!-- Step 1: enter number -->
    <div id="phone-step1">
      <div class="error-msg" id="phone-error"></div>
      <label>Phone Number</label>
      <input type="tel" id="phone-input" placeholder="+1 555 000 0000" />
      <div id="recaptcha-container"></div>
      <button class="btn" id="send-code-btn" onclick="sendCode()">Send Code</button>
    </div>

    <!-- Step 2: enter OTP -->
    <div id="phone-step2" style="display:none">
      <div class="back-link" onclick="backToStep1()">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        Back
      </div>
      <div class="error-msg" id="otp-error"></div>
      <label style="text-align:center;display:block;margin-bottom:12px">Enter the 6-digit code</label>
      <div class="otp-row">
        <input class="otp-box" maxlength="1" type="text" inputmode="numeric" />
        <input class="otp-box" maxlength="1" type="text" inputmode="numeric" />
        <input class="otp-box" maxlength="1" type="text" inputmode="numeric" />
        <input class="otp-box" maxlength="1" type="text" inputmode="numeric" />
        <input class="otp-box" maxlength="1" type="text" inputmode="numeric" />
        <input class="otp-box" maxlength="1" type="text" inputmode="numeric" />
      </div>
      <button class="btn" id="verify-btn" onclick="verifyCode()">Verify</button>
    </div>

  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script>
  firebase.initializeApp({
    apiKey:            "AIzaSyAb9ORZa7EQyKhLf8hL46Qh3FXZmNGzIjg",
    authDomain:        "ai-pen-c85a0.firebaseapp.com",
    projectId:         "ai-pen-c85a0",
    storageBucket:     "ai-pen-c85a0.firebasestorage.app",
    messagingSenderId: "997852271146",
    appId:             "1:997852271146:web:f9b42d91dce0ead0d86953",
    measurementId:     "G-L3KBGYBFWM"
  });

  const auth = firebase.auth();
  let signUpMode = false;
  let confirmResult = null;

  // If already signed in, go to app
  auth.onAuthStateChanged(user => {
    if (user) {
      window.location.href = '/';
      return;
    }
    document.getElementById('auth-overlay').style.display = 'none';
    document.getElementById('login-card').style.display = 'block';
  });

  function switchTab(tab) {
    document.getElementById('tab-email').classList.toggle('active', tab === 'email');
    document.getElementById('tab-phone').classList.toggle('active', tab === 'phone');
    document.getElementById('sec-email').classList.toggle('active', tab === 'email');
    document.getElementById('sec-phone').classList.toggle('active', tab === 'phone');
    clearErrors();
    if (tab === 'phone' && !window._recaptchaSetup) {
      setupRecaptcha();
    }
  }

  function toggleMode() {
    signUpMode = !signUpMode;
    document.getElementById('email-btn').textContent = signUpMode ? 'Create Account' : 'Sign In';
    document.getElementById('toggle-hint').textContent = signUpMode ? 'Already have an account?' : "Don't have an account?";
    document.getElementById('toggle-link').textContent = signUpMode ? ' Sign In' : ' Sign Up';
    clearErrors();
  }

  function clearErrors() {
    ['email-error','phone-error','otp-error'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.textContent = '';
    });
  }

  function friendlyError(code) {
    const map = {
      'auth/invalid-email':           'Please enter a valid email address.',
      'auth/user-not-found':          'No account found with this email.',
      'auth/wrong-password':          'Incorrect password. Try again.',
      'auth/email-already-in-use':    'An account with this email already exists.',
      'auth/weak-password':           'Password must be at least 6 characters.',
      'auth/too-many-requests':       'Too many attempts. Please wait and try again.',
      'auth/invalid-phone-number':    'Please enter a valid phone number (e.g. +1 555 000 0000).',
      'auth/invalid-verification-code': 'Incorrect code. Please try again.',
      'auth/code-expired':            'Code expired. Please request a new one.',
      'auth/network-request-failed':  'Network error. Check your connection.',
    };
    return map[code] || 'Something went wrong. Please try again.';
  }

  async function emailAction() {
    const email = document.getElementById('email-input').value.trim();
    const pass  = document.getElementById('pass-input').value;
    const errEl = document.getElementById('email-error');
    errEl.textContent = '';
    if (!email || !pass) { errEl.textContent = 'Please fill in all fields.'; return; }
    const btn = document.getElementById('email-btn');
    btn.disabled = true;
    btn.textContent = signUpMode ? 'Creating…' : 'Signing in…';
    try {
      if (signUpMode) {
        await auth.createUserWithEmailAndPassword(email, pass);
      } else {
        await auth.signInWithEmailAndPassword(email, pass);
      }
      window.location.href = '/';
    } catch (err) {
      errEl.textContent = friendlyError(err.code);
      btn.disabled = false;
      btn.textContent = signUpMode ? 'Create Account' : 'Sign In';
    }
  }

  function setupRecaptcha() {
    window._recaptchaSetup = true;
    window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
      size: 'invisible',
      callback: () => {}
    });
  }

  async function sendCode() {
    const phone  = document.getElementById('phone-input').value.trim();
    const errEl  = document.getElementById('phone-error');
    errEl.textContent = '';
    if (!phone) { errEl.textContent = 'Please enter your phone number.'; return; }
    if (!window._recaptchaSetup) setupRecaptcha();
    const btn = document.getElementById('send-code-btn');
    btn.disabled = true;
    btn.textContent = 'Sending…';
    try {
      confirmResult = await auth.signInWithPhoneNumber(phone, window.recaptchaVerifier);
      document.getElementById('phone-step1').style.display = 'none';
      document.getElementById('phone-step2').style.display = 'block';
      document.querySelectorAll('.otp-box')[0].focus();
    } catch (err) {
      errEl.textContent = friendlyError(err.code);
      btn.disabled = false;
      btn.textContent = 'Send Code';
      // Reset recaptcha so it can be used again
      window.recaptchaVerifier.render().then(id => window.grecaptcha && window.grecaptcha.reset(id));
    }
  }

  async function verifyCode() {
    const boxes = document.querySelectorAll('.otp-box');
    const code = Array.from(boxes).map(b => b.value).join('');
    const errEl = document.getElementById('otp-error');
    errEl.textContent = '';
    if (code.length < 6) { errEl.textContent = 'Please enter the full 6-digit code.'; return; }
    const btn = document.getElementById('verify-btn');
    btn.disabled = true;
    btn.textContent = 'Verifying…';
    try {
      await confirmResult.confirm(code);
      window.location.href = '/';
    } catch (err) {
      errEl.textContent = friendlyError(err.code);
      btn.disabled = false;
      btn.textContent = 'Verify';
    }
  }

  function backToStep1() {
    document.getElementById('phone-step2').style.display = 'none';
    document.getElementById('phone-step1').style.display = 'block';
    document.getElementById('phone-error').textContent = '';
    document.getElementById('otp-error').textContent = '';
    document.getElementById('send-code-btn').disabled = false;
    document.getElementById('send-code-btn').textContent = 'Send Code';
    document.querySelectorAll('.otp-box').forEach(b => b.value = '');
    // Reset recaptcha
    window._recaptchaSetup = false;
    document.getElementById('recaptcha-container').innerHTML = '';
    confirmResult = null;
  }

  // OTP box UX: auto-advance, backspace, paste
  document.querySelectorAll('.otp-box').forEach((box, i, boxes) => {
    box.addEventListener('input', () => {
      const v = box.value.replace(/\D/g, '');
      box.value = v.slice(-1);
      if (v && i < boxes.length - 1) boxes[i + 1].focus();
      if (Array.from(boxes).every(b => b.value)) verifyCode();
    });
    box.addEventListener('keydown', e => {
      if (e.key === 'Backspace' && !box.value && i > 0) {
        boxes[i - 1].focus();
        boxes[i - 1].value = '';
      }
    });
    box.addEventListener('paste', e => {
      e.preventDefault();
      const digits = e.clipboardData.getData('text').replace(/\D/g, '').slice(0, 6);
      boxes.forEach((b, j) => { b.value = digits[j] || ''; });
      if (digits.length) boxes[Math.min(digits.length, boxes.length - 1)].focus();
      if (digits.length === 6) verifyCode();
    });
  });
</script>
</body>
</html>
