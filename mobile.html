<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<meta name="theme-color" content="#0b0c12"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>AI Pen</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0c12;
  --sidebar:#0e0f1a;
  --panel:#13141f;
  --card:#1a1b28;
  --border:#1e2035;
  --border-l:#2a2d48;
  --accent:#7c5cfc;
  --accent-soft:rgba(124,92,252,.12);
  --green:#22c55e;--red:#f43f5e;--yellow:#eab308;
  --text:#eeeef5;--text-2:#7c7f9e;--text-3:#3a3d5c;
  --r:10px;
  --saf-b:env(safe-area-inset-bottom,0px);
  --saf-t:env(safe-area-inset-top,0px);
}
html,body{
  height:100%;
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);color:var(--text);
  overflow:hidden;
  overscroll-behavior:none;
  -webkit-text-size-adjust:100%;
  touch-action:manipulation;
}
button,input,textarea,select{font-family:inherit}
::-webkit-scrollbar{display:none}

/* ── LAYOUT ── */
.app{
  display:flex;flex-direction:column;
  height:100dvh;width:100vw;
  padding-top:var(--saf-t);
}

/* ── TOPBAR ── */
.topbar{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;
  background:var(--sidebar);
  border-bottom:1px solid var(--border);
  flex-shrink:0;min-height:52px;
}
.menu-btn{
  width:38px;height:38px;border-radius:var(--r);
  border:1px solid var(--border);background:var(--card);
  color:var(--text-2);font-size:17px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;
  -webkit-tap-highlight-color:transparent;
}
.logo{display:flex;align-items:center;gap:7px;flex:1;min-width:0}
.logo-mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(145deg,#7c5cfc,#c084fc);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;box-shadow:0 3px 10px rgba(124,92,252,.4)}
.logo-text{font-size:15px;font-weight:700;letter-spacing:-.3px}.logo-text span{color:#c084fc}
.t-pill{display:flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;background:rgba(34,197,94,.07);border:1px solid rgba(34,197,94,.16);font-size:10px;font-weight:600;color:var(--green);white-space:nowrap;flex-shrink:0}
.t-dot{width:4px;height:4px;border-radius:50%;background:var(--green);animation:pulse 2.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
.icon-btn{width:38px;height:38px;border-radius:var(--r);border:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-2);font-size:15px;flex-shrink:0;-webkit-tap-highlight-color:transparent;}

/* ── WAKE BAR ── */
.wake-bar{display:none;align-items:center;gap:8px;padding:8px 16px;background:rgba(124,92,252,.07);border-bottom:1px solid rgba(124,92,252,.14);font-size:12px;color:#c084fc;flex-shrink:0}
.wake-bar.show{display:flex}
.wake-bar-dot{width:6px;height:6px;border-radius:50%;background:#c084fc;animation:wakepulse 1s ease-in-out infinite;flex-shrink:0}
@keyframes wakepulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
.wake-bar-text{flex:1;font-size:11px;color:var(--text-3);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── MESSAGES ── */
.messages{
  flex:1;overflow-y:auto;
  padding:16px 0 8px;
  display:flex;flex-direction:column;gap:0;
  -webkit-overflow-scrolling:touch;
}
.welcome{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:24px 20px 16px;text-align:center;gap:6px;
}
.welcome-icon{width:52px;height:52px;border-radius:15px;background:linear-gradient(145deg,#7c5cfc,#c084fc);display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:8px;box-shadow:0 6px 22px rgba(124,92,252,.35)}
.welcome-title{font-size:20px;font-weight:700;letter-spacing:-.3px}
.welcome-sub{font-size:13.5px;color:var(--text-2);line-height:1.6;max-width:290px}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.chip{padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);font-size:12.5px;color:var(--text-2);cursor:pointer;-webkit-tap-highlight-color:transparent;white-space:nowrap}
.chip:active{border-color:var(--accent);color:#c084fc;background:var(--accent-soft)}
.msg-wrap{padding:3px 16px;display:flex;flex-direction:column}
.row-user{align-items:flex-end}.row-ai{align-items:flex-start}
.msg-inner{display:flex;gap:8px;max-width:100%}
.row-user .msg-inner{justify-content:flex-end;margin-left:auto}
.ai-avatar{width:26px;height:26px;min-width:26px;border-radius:7px;background:linear-gradient(135deg,var(--accent),#c084fc);display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:700;margin-top:1px;flex-shrink:0}
.bubble-user{max-width:82vw;background:linear-gradient(135deg,#7c5cfc,#a78bfa);color:#fff;padding:10px 14px;border-radius:18px 18px 4px 18px;font-size:14px;line-height:1.6;word-break:break-word;white-space:pre-wrap}
.bubble-user-time{font-size:10px;color:var(--text-3);text-align:right;margin-top:3px;padding-right:2px}
.bubble-ai-wrap{max-width:calc(100% - 38px)}
.bubble-ai{font-size:14px;line-height:1.75;color:var(--text);word-break:break-word;white-space:pre-wrap}
.msg-actions{display:flex;gap:2px;margin-top:6px}
.mab{width:32px;height:32px;border-radius:7px;border:none;background:none;color:var(--text-3);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;}
.mab.liked{color:var(--green)}.mab.disliked{color:var(--red)}
.typing-dots{display:flex;gap:5px;align-items:center;padding:10px 0 4px}
.typing-dot{width:6px;height:6px;border-radius:50%;background:var(--text-3);animation:bounce 1.3s ease-in-out infinite}
.typing-dot:nth-child(2){animation-delay:.16s}.typing-dot:nth-child(3){animation-delay:.32s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
.cursor-blink{display:inline-block;width:2px;height:13px;background:var(--accent);border-radius:1px;margin-left:2px;vertical-align:text-bottom;animation:blink .7s step-end infinite}
@keyframes blink{50%{opacity:0}}
.error-bar{display:none;align-items:center;gap:8px;margin:0 16px 6px;padding:9px 12px;background:rgba(244,63,94,.08);border:1px solid rgba(244,63,94,.2);border-radius:var(--r);font-size:12px;color:#fca5a5;flex-shrink:0}
.error-bar.show{display:flex}

/* ── VOICE ROW (the star of mobile) ── */
.voice-row{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px 6px;
  background:var(--sidebar);
  border-top:1px solid var(--border);
  flex-shrink:0;
}
.wake-btn{
  flex:1;min-height:50px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  border-radius:50px;
  border:1.5px solid var(--border);
  background:var(--card);
  color:var(--text-2);font-size:14px;font-weight:600;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:all .15s;
}
.wake-btn.wake-on{background:rgba(124,92,252,.12);border-color:rgba(124,92,252,.3);color:#c084fc}
.wake-btn.wake-listening{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3);color:#f87171;animation:ring 1.2s ease-in-out infinite}
@keyframes ring{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.3)}60%{box-shadow:0 0 0 9px rgba(239,68,68,0)}}
.mic-btn{
  width:50px;height:50px;flex-shrink:0;
  border-radius:50%;
  border:1.5px solid var(--border);
  background:var(--card);
  color:var(--text-2);font-size:19px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.mic-btn.recording{color:var(--red);border-color:rgba(244,63,94,.4);background:rgba(244,63,94,.07);animation:pulse 1s ease-in-out infinite}

/* ── INPUT ROW ── */
.input-row{
  padding:6px 12px calc(10px + var(--saf-b));
  background:var(--sidebar);
  flex-shrink:0;
}
.input-box{
  display:flex;align-items:flex-end;gap:7px;
  background:var(--panel);
  border:1.5px solid var(--border);
  border-radius:14px;padding:8px 10px;
}
.input-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,92,252,.1)}
#msg-input{
  flex:1;background:none;border:none;outline:none;
  color:var(--text);font-size:15px;resize:none;
  min-height:24px;max-height:100px;
  line-height:1.5;padding:2px 0;
  -webkit-appearance:none;
}
#msg-input::placeholder{color:var(--text-3)}
.send-btn{
  width:36px;height:36px;min-width:36px;
  border-radius:9px;background:var(--accent);
  border:none;display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;color:#fff;
  box-shadow:0 3px 12px rgba(124,92,252,.4);
  -webkit-tap-highlight-color:transparent;
}
.send-btn:active{transform:scale(.93)}

/* ── DRAWER ── */
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;opacity:0;pointer-events:none;transition:opacity .25s}
.drawer-overlay.open{opacity:1;pointer-events:all}
.drawer{
  position:fixed;top:0;left:0;bottom:0;width:280px;
  background:var(--sidebar);border-right:1px solid var(--border);
  display:flex;flex-direction:column;z-index:201;
  transform:translateX(-100%);
  transition:transform .25s cubic-bezier(.4,0,.2,1);
  padding-top:var(--saf-t);
}
.drawer.open{transform:translateX(0)}
.d-head{padding:14px 14px 10px;flex-shrink:0;border-bottom:1px solid var(--border)}
.d-logo-row{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.d-close{margin-left:auto;width:30px;height:30px;border-radius:8px;border:none;background:rgba(255,255,255,.07);color:var(--text-2);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;}
.d-new-btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:9px;background:var(--accent);color:#fff;border:none;border-radius:var(--r);font-size:13px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.d-scroll{flex:1;overflow-y:auto;padding:6px 10px}
.d-label{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--text-3);text-transform:uppercase;padding:14px 8px 5px}
.d-item{display:flex;align-items:center;gap:9px;width:100%;padding:10px 10px;border:none;background:none;border-radius:var(--r);color:var(--text-2);font-size:13px;font-weight:500;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent;}
.d-item:active{background:rgba(255,255,255,.07);color:var(--text)}
.d-divider{height:1px;background:var(--border);margin:6px 4px}
.d-session-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r);cursor:pointer;-webkit-tap-highlight-color:transparent;}
.d-session-item:active{background:rgba(255,255,255,.05)}
.d-session-name{font-size:12px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-session-date{font-size:10px;color:var(--text-3);margin-top:1px}
.d-bottom{padding:10px 14px calc(12px + var(--saf-b));flex-shrink:0;border-top:1px solid var(--border)}
.d-user-row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--r)}
.d-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#c084fc);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0}
.d-user-info{flex:1;min-width:0}
.d-user-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-user-email{font-size:11px;color:var(--text-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── MODEL SHEET ── */
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:300;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-overlay.open{opacity:1;pointer-events:all}
.sheet{
  position:fixed;left:0;right:0;bottom:0;
  background:var(--panel);border-radius:18px 18px 0 0;
  border:1px solid var(--border-l);border-bottom:none;
  z-index:301;transform:translateY(100%);
  transition:transform .25s cubic-bezier(.4,0,.2,1);
  padding-bottom:var(--saf-b);
  max-height:72vh;display:flex;flex-direction:column;
}
.sheet.open{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;background:var(--border-l);border-radius:2px;margin:10px auto 14px;flex-shrink:0}
.sheet-title{font-size:10px;font-weight:700;padding:0 16px 10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;flex-shrink:0}
.sheet-scroll{flex:1;overflow-y:auto}
.model-item{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;border-top:1px solid var(--border);-webkit-tap-highlight-color:transparent;}
.model-item:active{background:rgba(255,255,255,.04)}
.model-item.sel{background:var(--accent-soft)}
.mi-icon{font-size:20px;flex-shrink:0}
.mi-info{flex:1}.mi-name{font-size:13px;font-weight:600}.mi-desc{font-size:11px;color:var(--text-3);margin-top:1px}
.mi-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;flex-shrink:0}
.mi-badge.free{background:rgba(34,197,94,.1);color:var(--green);border:1px solid rgba(34,197,94,.2)}
.mi-badge.fast{background:rgba(234,179,8,.1);color:var(--yellow);border:1px solid rgba(234,179,8,.2)}
.mi-badge.smart{background:var(--accent-soft);color:#c084fc;border:1px solid rgba(124,92,252,.25)}

/* ── TOAST ── */
.toast{position:fixed;bottom:calc(110px + var(--saf-b));left:50%;transform:translateX(-50%) translateY(14px);background:var(--card);border:1px solid var(--border-l);border-radius:10px;padding:9px 18px;font-size:13px;box-shadow:0 10px 34px rgba(0,0,0,.6);opacity:0;transition:opacity .15s,transform .15s;z-index:999;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">

  <!-- TOPBAR -->
  <div class="topbar">
    <button class="menu-btn" onclick="openDrawer()">☰</button>
    <div class="logo">
      <div class="logo-mark">✦</div>
      <div class="logo-text">AI<span>Pen</span></div>
    </div>
    <div class="t-pill"><div class="t-dot"></div><span id="model-badge">GPT-4o Mini</span></div>
    <button class="icon-btn" onclick="openModelSheet()" title="Switch model">⚡</button>
  </div>

  <!-- WAKE BAR -->
  <div class="wake-bar" id="wake-bar">
    <div class="wake-bar-dot"></div>
    <span>Listening for <strong>"Hey Pen"</strong>…</span>
    <span class="wake-bar-text" id="wake-bar-transcript"></span>
  </div>

  <!-- MESSAGES -->
  <div class="messages" id="messages">
    <div class="welcome" id="welcome-screen">
      <div class="welcome-icon">✦</div>
      <div class="welcome-title" id="welcome-title">Hey there 👋</div>
      <div class="welcome-sub">Say <strong>"Hey Pen"</strong> and I'll listen and talk back — fully hands-free.</div>
      <div class="chips">
        <div class="chip" onclick="sendQuick('What is photosynthesis?')">🌿 Explain</div>
        <div class="chip" onclick="sendQuick('Write a short poem about the ocean')">✍️ Write</div>
        <div class="chip" onclick="sendQuick('Translate hello to French')">🌐 Translate</div>
        <div class="chip" onclick="sendQuick('Give me 3 creative project ideas')">💡 Ideas</div>
      </div>
    </div>
    <div id="typing-row" class="msg-wrap row-ai" style="display:none">
      <div class="msg-inner">
        <div class="ai-avatar">✦</div>
        <div class="typing-dots">
          <div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="error-bar" id="error-bar">⚠️ <span id="error-text"></span></div>

  <!-- VOICE ROW — the star of mobile -->
  <div class="voice-row">
    <button class="wake-btn" id="wake-btn" onclick="toggleWakeWord()">🎙 Hey Pen</button>
    <button class="mic-btn" id="mic-btn" onclick="toggleVoice()">🎤</button>
  </div>

  <!-- INPUT ROW -->
  <div class="input-row">
    <div class="input-box">
      <textarea id="msg-input" placeholder="Or type here…" rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" onclick="sendMessage()">
        <svg width="14" height="14" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- DRAWER -->
<div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="d-head">
    <div class="d-logo-row">
      <div class="logo-mark" style="width:26px;height:26px;border-radius:7px;font-size:12px">✦</div>
      <span style="font-size:15px;font-weight:700">AI<span style="color:#c084fc">Pen</span></span>
      <button class="d-close" onclick="closeDrawer()">✕</button>
    </div>
    <button class="d-new-btn" onclick="startNewChat();closeDrawer()">
      <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New Chat
    </button>
  </div>
  <div class="d-scroll">
    <div class="d-label">Recent</div>
    <div id="d-recent"></div>
    <div class="d-divider"></div>
    <div class="d-label">Voice</div>
    <button class="d-item" id="d-autospeak-btn" onclick="toggleAutoSpeak()">
      <span>🔊</span><span id="d-autospeak-label">Auto-speak: ON</span>
    </button>
    <div class="d-divider"></div>
    <div class="d-label">Switch</div>
    <button class="d-item" onclick="goDesktop()">
      <span>🖥</span>Desktop version
    </button>
    <div class="d-divider"></div>
    <div class="d-label">Account</div>
    <button class="d-item" onclick="signOut()"><span>🚪</span>Sign Out</button>
  </div>
  <div class="d-bottom">
    <div class="d-user-row">
      <div class="d-avatar" id="d-avatar">U</div>
      <div class="d-user-info">
        <div class="d-user-name" id="d-user-name">User</div>
        <div class="d-user-email" id="d-user-email"></div>
      </div>
    </div>
  </div>
</div>

<!-- MODEL SHEET -->
<div class="sheet-overlay" id="sheet-overlay" onclick="closeModelSheet()"></div>
<div class="sheet" id="model-sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title">Choose Model</div>
  <div class="sheet-scroll" id="model-list"></div>
</div>

<div class="toast" id="toast"></div>

  {id:'openai/gpt-4o',                         name:'GPT-4o',            desc:'Most capable',     icon:'🔵', tag:'smart'},
  {id:'anthropic/claude-3-5-haiku',            name:'Claude 3.5 Haiku',  desc:'Fast & smart',     icon:'🟣', tag:'fast'},
  {id:'anthropic/claude-3-5-sonnet',           name:'Claude 3.5 Sonnet', desc:'Most capable',     icon:'🟣', tag:'smart'},
  {id:'google/gemini-flash-1.5',               name:'Gemini Flash',      desc:'Ultra fast',       icon:'🔴', tag:'fast'},
  {id:'meta-llama/llama-3.1-8b-instruct:free', name:'Llama 3.1 8B',      desc:'Free tier',        icon:'⚪', tag:'free'},
  {id:'mistralai/mistral-7b-instruct:free',    name:'Mistral 7B',        desc:'Free tier',        icon:'⚪', tag:'free'},
];

// ── State ──
let activeModel = localStorage.getItem('pref_model') || 'openai/gpt-4o-mini';
let chatHistory = [];
// Auto-speak defaults ON on mobile (the key differentiator)
let autoSpeak   = localStorage.getItem('pref_autospeak') !== 'false';

// ── Auth ──
auth.onAuthStateChanged(user => {
  if (!user) { window.location.href = '/login.html'; return; }
  const name = user.displayName || user.email?.split('@')[0] || 'User';
  document.getElementById('d-avatar').textContent    = name[0].toUpperCase();
  document.getElementById('d-user-name').textContent = name;
  document.getElementById('d-user-email').textContent= user.email || '';
  const h = new Date().getHours();
  const greet = h<5?'Good night':h<12?'Good morning':h<17?'Good afternoon':h<21?'Good evening':'Good night';
  document.getElementById('welcome-title').textContent = `${greet}, ${name.split(' ')[0]} 👋`;
  updateAutoSpeakLabel();
  buildModelList();
  loadDrawerRecent();
});

// ── Chat ──
function sendMessage() {
  const inp = document.getElementById('msg-input');
  const text = inp.value.trim(); if (!text) return;
  inp.value = ''; inp.style.height = 'auto';
  hideWelcome(); addUserMsg(text);
  chatHistory.push({role:'user', content:text});
  fetchAI();
}
function sendQuick(text) {
  hideWelcome(); addUserMsg(text);
  chatHistory.push({role:'user', content:text});
  fetchAI();
}
function handleKey(e) { if (e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();} }
function autoResize(el) { el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,100)+'px'; }
function hideWelcome() { const ws=document.getElementById('welcome-screen'); if(ws) ws.style.display='none'; }

function addUserMsg(text) {
  const msgs = document.getElementById('messages');
  const tr   = document.getElementById('typing-row');
  const div  = document.createElement('div');
  div.className = 'msg-wrap row-user';
  div.innerHTML = `<div class="msg-inner"><div>
    <div class="bubble-user">${esc(text)}</div>
    <div class="bubble-user-time">✓ ${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>
  </div></div>`;
  msgs.insertBefore(div, tr);
  msgs.scrollTop = msgs.scrollHeight;
  saveSession();
}

async function fetchAI() {
  const msgs   = document.getElementById('messages');
  const tr     = document.getElementById('typing-row');
  const errBar = document.getElementById('error-bar');
  errBar.classList.remove('show');
  tr.style.display = 'flex';
  msgs.scrollTop = msgs.scrollHeight;

  const sysPrompt = localStorage.getItem('pref_sysprompt') ||
    'You are AI Pen, a smart pen assistant. ALWAYS reply in 1-3 short sentences. Never use bullet points, headers, or LaTeX. Be direct and conversational. Only give a longer answer if the user explicitly asks for detail or explanation.';

  let fullText='', aiWrap=null, bubbleContent=null, cursor=null;
  try {
    const res = await fetch('/api/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:activeModel, messages:[{role:'system',content:sysPrompt},...chatHistory]})
    });
    if (!res.ok) {
      const err = await res.json().catch(()=>({error:{message:res.statusText}}));
      throw new Error(err.error?.message || `HTTP ${res.status}`);
    }
    tr.style.display = 'none';
    aiWrap = document.createElement('div');
    aiWrap.className = 'msg-wrap row-ai';
    aiWrap.innerHTML = `<div class="msg-inner">
      <div class="ai-avatar">✦</div>
      <div class="bubble-ai-wrap">
        <div class="bubble-ai"><span class="msg-content"></span><span class="cursor-blink"></span></div>
        <div class="msg-actions">
          <button class="mab" onclick="copyBubble(this)">📋</button>
          <button class="mab" onclick="speakBubble(this)">🔊</button>
        </div>
      </div>
    </div>`;
    msgs.insertBefore(aiWrap, tr);
    bubbleContent = aiWrap.querySelector('.msg-content');
    cursor        = aiWrap.querySelector('.cursor-blink');

    const reader  = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const {done,value} = await reader.read(); if (done) break;
      buf += decoder.decode(value,{stream:true});
      const lines = buf.split('\n'); buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim(); if (data==='[DONE]') break;
        try {
          const delta = JSON.parse(data).choices?.[0]?.delta?.content||'';
          if (delta){fullText+=delta; bubbleContent.textContent=fullText; msgs.scrollTop=msgs.scrollHeight;}
        } catch {}
      }
    }
    cursor?.remove();
    chatHistory.push({role:'assistant', content:fullText});
    saveSession(); loadDrawerRecent();
    if (window._speakNextReply || autoSpeak) {
      window._speakNextReply = false;
      speakText(fullText, ()=>{ if(wakeEnabled) scheduleWakeRestart(); });
    } else if (wakeEnabled) { scheduleWakeRestart(); }
  } catch(err) {
    tr.style.display = 'none';
    cursor?.remove(); aiWrap?.remove();
    document.getElementById('error-text').textContent = err.message;
    errBar.classList.add('show');
    if (chatHistory.at(-1)?.role==='user') chatHistory.pop();
    setTimeout(()=>errBar.classList.remove('show'), 8000);
    window._speakNextReply = false;
    if (wakeEnabled) scheduleWakeRestart();
  }
}

function startNewChat() {
  chatHistory = []; window._sessionId = null;
  const msgs = document.getElementById('messages');
  const tr   = document.getElementById('typing-row');
  while (msgs.firstChild && msgs.firstChild!==tr) msgs.removeChild(msgs.firstChild);
  const ws = document.createElement('div');
  ws.id = 'welcome-screen'; ws.className = 'welcome';
  const h = new Date().getHours();
  const greet = h<5?'Good night':h<12?'Good morning':h<17?'Good afternoon':h<21?'Good evening':'Good night';
  const u = auth.currentUser;
  const fn = (u?.displayName||u?.email?.split('@')[0]||'User').split(' ')[0];
  ws.innerHTML = `<div class="welcome-icon">✦</div>
    <div class="welcome-title">${greet}, ${fn} 👋</div>
    <div class="welcome-sub">Say <strong>"Hey Pen"</strong> — I'll listen and talk back.</div>
    <div class="chips">
      <div class="chip" onclick="sendQuick('What is photosynthesis?')">🌿 Explain</div>
      <div class="chip" onclick="sendQuick('Write a short poem about the ocean')">✍️ Write</div>
      <div class="chip" onclick="sendQuick('Translate hello to French')">🌐 Translate</div>
      <div class="chip" onclick="sendQuick('Give me 3 creative project ideas')">💡 Ideas</div>
    </div>`;
  msgs.insertBefore(ws, tr);
  toast('New chat');
}

// ── Message actions ──
function copyBubble(btn) {
  const t = btn.closest('.bubble-ai-wrap')?.querySelector('.msg-content')?.textContent||'';
  navigator.clipboard.writeText(t).then(()=>toast('Copied!'));
}
function speakBubble(btn) {
  const t = btn.closest('.bubble-ai-wrap')?.querySelector('.msg-content')?.textContent||'';
  if (!t) return;
  if (speechSynthesis.speaking){speechSynthesis.cancel();toast('Stopped.');return;}
  speakText(t); toast('Reading…');
}
function speakText(text, onDone) {
  if (!text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = localStorage.getItem('pref_vlang')||'en-US';
  u.rate = parseFloat(localStorage.getItem('pref_srate')||'1');
  if (onDone) u.onend = onDone;
  speechSynthesis.speak(u);
}

// ── Auto-speak ──
function toggleAutoSpeak() {
  autoSpeak = !autoSpeak;
  localStorage.setItem('pref_autospeak', String(autoSpeak));
  updateAutoSpeakLabel();
  toast(autoSpeak ? '🔊 Auto-speak ON' : 'Auto-speak OFF');
}
function updateAutoSpeakLabel() {
  const el = document.getElementById('d-autospeak-label');
  if (el) el.textContent = `Auto-speak: ${autoSpeak?'ON':'OFF'}`;
}

// ── Sessions ──
function saveSession() {
  if (!chatHistory.length) return;
  const preview = chatHistory[0]?.content?.substring(0,70)||'Conversation';
  if (!window._sessionId) window._sessionId = Date.now();
  const user = auth.currentUser; if (!user) return;
  db.collection('users').doc(user.uid).collection('sessions').doc(String(window._sessionId)).set({
    preview, messages:chatHistory, count:chatHistory.length,
    date: new Date().toLocaleDateString(),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }).catch(()=>{});
}
function loadDrawerRecent() {
  const user = auth.currentUser; if (!user) return;
  const el = document.getElementById('d-recent');
  db.collection('users').doc(user.uid).collection('sessions')
    .orderBy('updatedAt','desc').limit(6).get()
    .then(snap => {
      if (snap.empty){el.innerHTML='<div style="padding:6px 10px;font-size:12px;color:var(--text-3)">No history yet</div>';return;}
      el.innerHTML = snap.docs.map(d=>{
        const s=d.data();
        return `<div class="d-session-item" onclick="loadSession('${d.id}');closeDrawer()">
          <span style="font-size:13px;flex-shrink:0">💬</span>
          <div style="flex:1;min-width:0">
            <div class="d-session-name">${esc(s.preview||'Chat')}</div>
            <div class="d-session-date">${s.date||''}</div>
          </div>
        </div>`;
      }).join('');
    }).catch(()=>{});
}
function loadSession(id) {
  const user = auth.currentUser; if (!user) return;
  db.collection('users').doc(user.uid).collection('sessions').doc(id).get().then(doc=>{
    if (!doc.exists) return;
    const s = doc.data(); chatHistory=s.messages||[]; window._sessionId=parseInt(id);
    const msgs=document.getElementById('messages');
    const tr=document.getElementById('typing-row');
    while(msgs.firstChild&&msgs.firstChild!==tr) msgs.removeChild(msgs.firstChild);
    chatHistory.forEach(msg=>{
      const row=document.createElement('div');
      if(msg.role==='user'){
        row.className='msg-wrap row-user';
        row.innerHTML=`<div class="msg-inner"><div><div class="bubble-user">${esc(msg.content)}</div></div></div>`;
      }else{
        row.className='msg-wrap row-ai';
        row.innerHTML=`<div class="msg-inner"><div class="ai-avatar">✦</div><div class="bubble-ai-wrap"><div class="bubble-ai"><span class="msg-content">${esc(msg.content)}</span></div><div class="msg-actions"><button class="mab" onclick="copyBubble(this)">📋</button><button class="mab" onclick="speakBubble(this)">🔊</button></div></div></div>`;
      }
      msgs.insertBefore(row,tr);
    });
    msgs.scrollTop=msgs.scrollHeight;
    toast('Session loaded');
  }).catch(()=>toast('Could not load'));
}

// ── Model sheet ──
function buildModelList() {
  document.getElementById('model-list').innerHTML = MODELS.map(m=>
    `<div class="model-item ${m.id===activeModel?'sel':''}" onclick="selectModel('${m.id}')">
      <span class="mi-icon">${m.icon}</span>
      <div class="mi-info"><div class="mi-name">${m.name}</div><div class="mi-desc">${m.desc}</div></div>
      <span class="mi-badge ${m.tag}">${m.tag}</span>
    </div>`
  ).join('');
}
function selectModel(id) {
  activeModel=id; localStorage.setItem('pref_model',id);
  const m=MODELS.find(x=>x.id===id);
  document.getElementById('model-badge').textContent=m?.name||'AI';
  buildModelList(); closeModelSheet(); toast('Model: '+(m?.name||id));
}

// ── Drawers / Sheets ──
function openDrawer()     { document.getElementById('drawer').classList.add('open'); document.getElementById('drawer-overlay').classList.add('open'); }
function closeDrawer()    { document.getElementById('drawer').classList.remove('open'); document.getElementById('drawer-overlay').classList.remove('open'); }
function openModelSheet() { buildModelList(); document.getElementById('model-sheet').classList.add('open'); document.getElementById('sheet-overlay').classList.add('open'); }
function closeModelSheet(){ document.getElementById('model-sheet').classList.remove('open'); document.getElementById('sheet-overlay').classList.remove('open'); }

// ── Account ──
function signOut() {
  if(!confirm('Sign out?')) return;
  auth.signOut().then(()=>location.href='/login.html');
}
function goDesktop() {
  sessionStorage.setItem('prefer_desktop','1');
  location.href='/';
}

// ────────────────────────────────────────────────
// HEY PEN — robust wake word detection
// ────────────────────────────────────────────────
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const WAKE_PHRASES = ['hey pen','hey penn','hey pens','hey pan','a pen','hey pin','hay pen','hey ben','hey fen'];

let wakeEnabled=false, wakeRec=null, wakeRestartT=null, cmdRec=null, isListening=false;

function updateWakeUI() {
  const btn=document.getElementById('wake-btn');
  const bar=document.getElementById('wake-bar');
  if (!wakeEnabled) {
    btn.className='wake-btn'; btn.textContent='🎙 Hey Pen';
    bar.classList.remove('show');
  } else if (isListening) {
    btn.className='wake-btn wake-listening'; btn.textContent='🔴 Listening…';
    bar.classList.remove('show');
  } else {
    btn.className='wake-btn wake-on'; btn.textContent='🎙 Hey Pen: ON';
    bar.classList.add('show');
    document.getElementById('wake-bar-transcript').textContent='';
  }
}

function toggleWakeWord() {
  if (!SR){toast('Speech not supported in this browser');return;}
  wakeEnabled=!wakeEnabled;
  if(wakeEnabled){toast('Say "Hey Pen" to start');startWakeRec();}
  else{stopWakeRec();toast('Wake word off');}
  updateWakeUI();
}

function stopWakeRec() {
  clearTimeout(wakeRestartT);
  if(wakeRec){try{wakeRec.abort();}catch{}wakeRec=null;}
}

function scheduleWakeRestart(delay=300) {
  clearTimeout(wakeRestartT);
  wakeRestartT=setTimeout(startWakeRec,delay);
}

function startWakeRec() {
  stopWakeRec();
  if(!wakeEnabled||isListening) return;
  wakeRec=new SR();
  wakeRec.lang=localStorage.getItem('pref_vlang')||'en-US';
  wakeRec.continuous=true;
  wakeRec.interimResults=true;
  wakeRec.maxAlternatives=3;
  wakeRec.onresult=e=>{
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(!e.results[i].isFinal) document.getElementById('wake-bar-transcript').textContent=e.results[i][0].transcript;
      for(let j=0;j<e.results[i].length;j++){
        const said=e.results[i][j].transcript.toLowerCase().trim();
        if(WAKE_PHRASES.some(p=>said.includes(p))){onWakeDetected();return;}
      }
    }
  };
  wakeRec.onend=()=>{if(wakeEnabled&&!isListening)scheduleWakeRestart(200);};
  wakeRec.onerror=e=>{
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){wakeEnabled=false;updateWakeUI();toast('Mic access denied');return;}
    if(wakeEnabled&&!isListening)scheduleWakeRestart(e.error==='network'?3000:500);
  };
  try{wakeRec.start();}catch{if(wakeEnabled)scheduleWakeRestart(500);}
}

function onWakeDetected() {
  stopWakeRec(); playBeep();
  isListening=true; updateWakeUI();
  setTimeout(()=>startCommandMode(true),350);
}

function toggleVoice() {
  if(!SR){toast('Speech not supported');return;}
  if(isListening){cmdRec?.stop();return;}
  startCommandMode(false);
}

function startCommandMode(fromWake) {
  if(!SR) return;
  cmdRec=new SR();
  cmdRec.lang=localStorage.getItem('pref_vlang')||'en-US';
  cmdRec.continuous=false; cmdRec.interimResults=true; cmdRec.maxAlternatives=1;
  cmdRec.onstart=()=>{isListening=true;document.getElementById('mic-btn').classList.add('recording');updateWakeUI();};
  cmdRec.onresult=e=>{
    let final='';
    for(let i=e.resultIndex;i<e.results.length;i++) if(e.results[i].isFinal) final+=e.results[i][0].transcript;
    const inp=document.getElementById('msg-input');
    if(final){inp.value=(inp.value?inp.value+' ':'')+final;autoResize(inp);}
  };
  cmdRec.onerror=()=>endCommandMode(fromWake,false);
  cmdRec.onend  =()=>endCommandMode(fromWake,true);
  cmdRec.start();
}

function endCommandMode(fromWake,sendIfFilled) {
  isListening=false;
  document.getElementById('mic-btn').classList.remove('recording');
  if(fromWake&&sendIfFilled){
    const inp=document.getElementById('msg-input');
    if(inp.value.trim()){window._speakNextReply=true;sendMessage();}
    else if(wakeEnabled) scheduleWakeRestart();
  } else if(wakeEnabled) scheduleWakeRestart();
  updateWakeUI();
}

document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&wakeEnabled&&!isListening) scheduleWakeRestart(500);
});

function playBeep() {
  try {
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const osc=ctx.createOscillator(),gain=ctx.createGain();
    osc.connect(gain);gain.connect(ctx.destination);
    osc.type='sine';osc.frequency.value=880;
    gain.gain.setValueAtTime(0,ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.2,ctx.currentTime+0.02);
    gain.gain.linearRampToValueAtTime(0,ctx.currentTime+0.18);
    osc.start(ctx.currentTime);osc.stop(ctx.currentTime+0.2);
    setTimeout(()=>ctx.close(),400);
  }catch{}
}

// ── Toast ──
let toastT;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2600);
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
