<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Pen</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

.container {
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
}

#app { display:none; }

input {
  padding:12px;
  margin:6px;
  border-radius:8px;
  border:none;
  width:260px;
}

button {
  padding:12px;
  margin:6px;
  border:none;
  border-radius:8px;
  background:#2563eb;
  color:white;
  cursor:pointer;
}

#chat {
  width:90%;
  max-width:700px;
}

.msg {
  padding:10px;
  margin:5px 0;
  border-radius:10px;
}

.user { background:#2563eb; }
.ai { background:#1e293b; }
</style>
</head>

<body>

<!-- AUTH -->
<div id="auth" class="container">
  <h2>AI Pen</h2>

  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button onclick="signup()">Sign Up</button>
  <button onclick="login()">Login</button>
</div>

<!-- APP -->
<div id="app" class="container">
  <button onclick="logout()">Logout</button>

  <div id="chat"></div>

  <input id="msg" placeholder="Ask something...">
  <button onclick="send()">Send</button>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
/* ===== YOUR API KEY ===== */
const API_KEY = "PASTE_YOUR_OPENROUTER_KEY";

/* ===== FIREBASE CONFIG ===== */
firebase.initializeApp({
  apiKey:"AIzaSyAb9ORZa7EQyKhLf8hL46Qh3FXZmNGzIjg",
  authDomain:"ai-pen-c85a0.firebaseapp.com",
  projectId:"ai-pen-c85a0"
});

const auth = firebase.auth();

/* ===== AUTH ===== */
function signup(){
  auth.createUserWithEmailAndPassword(email.value,password.value)
  .then(()=>alert("Account created"))
  .catch(e=>alert(e.code));
}

function login(){
  auth.signInWithEmailAndPassword(email.value,password.value)
  .catch(e=>alert(e.code));
}

function logout(){
  auth.signOut();
}

auth.onAuthStateChanged(user=>{
  if(user){
    auth.style.display="none";
    app.style.display="flex";
  } else {
    auth.style.display="flex";
    app.style.display="none";
  }
});

/* ===== CHAT ===== */
function add(text,type){
  const d=document.createElement("div");
  d.className="msg "+type;
  d.innerText=text;
  chat.appendChild(d);
}

async function send(){
  const text=msg.value;
  if(!text) return;

  add(text,"user");
  msg.value="";

  const reply=await askAI(text);
  add(reply,"ai");
}

/* ===== AI ===== */
async function askAI(message){
  try{
    const res = await fetch("https://openrouter.ai/api/v1/chat/completions",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer "+API_KEY,
        "HTTP-Referer":"https://mathissnipes.github.io",
        "X-Title":"AI Pen"
      },
      body:JSON.stringify({
        model:"mistralai/mistral-7b-instruct:free",
        messages:[
          {role:"user",content:message}
        ]
      })
    });

    const data = await res.json();

    if(!data.choices){
      return "ERROR: " + JSON.stringify(data);
    }

    return data.choices[0].message.content;

  }catch(e){
    return "Connection error";
  }
}
</script>

</body>
</html>
