<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AI Pen</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:linear-gradient(180deg,#0f2027,#203a43,#2c5364);
  color:white;
}

/* Layout */
.container{
  max-width:420px;
  margin:auto;
  height:100vh;
  display:flex;
  flex-direction:column;
  padding:15px;
}

/* Header */
.title{
  text-align:center;
  font-size:24px;
  font-weight:700;
  margin-bottom:10px;
}

/* Chat */
.chat{
  flex:1;
  overflow-y:auto;
  padding:10px 0;
}

.msg{
  max-width:75%;
  padding:12px;
  border-radius:18px;
  margin-bottom:10px;
  font-size:14px;
  line-height:1.4;
}

.user{
  background:#00c6ff;
  margin-left:auto;
}

.ai{
  background:rgba(255,255,255,0.2);
}

/* Inputs */
input{
  width:90%;
  padding:10px;
  margin:5px;
  border-radius:8px;
  border:none;
}

button{
  width:90%;
  padding:12px;
  margin:5px;
  border-radius:10px;
  border:none;
  background:#00c6ff;
  color:white;
  font-size:16px;
}

/* Mic */
.mic{
  width:70px;
  height:70px;
  border-radius:50%;
  font-size:26px;
  margin:auto;
  display:block;
}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->
<div id="login">
  <div class="title">AI Pen</div>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button id="loginBtn">Login</button>
  <button id="signupBtn">Sign Up</button>
</div>

<!-- APP -->
<div id="app" style="display:none;">
  <div class="title">AI Pen</div>
  <div id="chat" class="chat"></div>
  <button id="mic" class="mic">🎙️</button>
  <button id="logoutBtn">Logout</button>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

/* Firebase */
const firebaseConfig = {
  apiKey: "AIzaSyAb9ORZa7EQyKhLf8hL46Qh3FXZmNGzIjg",
  authDomain: "ai-pen-c85a0.firebaseapp.com",
  projectId: "ai-pen-c85a0",
  storageBucket: "ai-pen-c85a0.firebasestorage.app",
  messagingSenderId: "997852271146",
  appId: "1:997852271146:web:f9b42d91dce0ead0d86953"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth();
const db = getFirestore();

let user = null;

/* UI */
const loginDiv = document.getElementById("login");
const appDiv = document.getElementById("app");
const chat = document.getElementById("chat");

/* Buttons */
document.getElementById("loginBtn").onclick = login;
document.getElementById("signupBtn").onclick = signup;
document.getElementById("logoutBtn").onclick = logout;

/* 🔥 AUTO LOGIN */
onAuthStateChanged(auth, (u)=>{
  if(u){
    user = u;
    startApp();
  }
});

/* 🔊 VOICE */
function speak(text){
  speechSynthesis.cancel();

  function run(){
    const voices = speechSynthesis.getVoices();
    const s = new SpeechSynthesisUtterance(text);

    s.voice = voices.find(v=>v.lang.includes("en")) || voices[0];
    s.rate = 0.95;

    speechSynthesis.speak(s);
  }

  if(speechSynthesis.getVoices().length===0){
    speechSynthesis.onvoiceschanged = run;
  }else{
    run();
  }
}

/* LOGIN */
async function login(){
  try{
    const email = emailVal();
    const pass = passVal();

    const res = await signInWithEmailAndPassword(auth,email,pass);
    user = res.user;
    startApp();

  }catch(e){
    alert(e.message);
  }
}

/* SIGNUP */
async function signup(){
  try{
    const email = emailVal();
    const pass = passVal();

    const res = await createUserWithEmailAndPassword(auth,email,pass);
    user = res.user;
    startApp();

  }catch(e){
    alert(e.message);
  }
}

/* LOGOUT */
async function logout(){
  await signOut(auth);
  location.reload();
}

/* START APP */
async function startApp(){
  loginDiv.style.display="none";
  appDiv.style.display="block";
  loadMessages();
}

/* LOAD */
async function loadMessages(){
  chat.innerHTML = "";

  const snap = await getDocs(collection(db,"users",user.uid,"chat"));

  snap.forEach(doc=>{
    const d = doc.data();
    addMessage(d.text, d.role==="user");
  });
}

/* SAVE */
async function save(text,role){
  await addDoc(collection(db,"users",user.uid,"chat"),{text,role});
}

/* UI */
function addMessage(text,isUser){
  const div=document.createElement("div");
  div.className="msg "+(isUser?"user":"ai");
  div.innerText=text;
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
}

/* Helpers */
function emailVal(){ return document.getElementById("email").value }
function passVal(){ return document.getElementById("password").value }

/* MIC */
document.getElementById("mic").onclick = ()=>{
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const recognition = new SR();

  speechSynthesis.resume();

  recognition.onresult = async (e)=>{
    let text = e.results[0][0].transcript;

    addMessage(text,true);
    save(text,"user");

    let res = await fetch("https://fortunate-enraged-lines--mathischui.replit.app/ask",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({question:text})
    });

    let data = await res.json();
    let ans = data.choices?.[0]?.message?.content || "No answer";

    if(ans.includes(".")){
      ans = ans.split(".")[0] + ".";
    }

    addMessage(ans,false);
    save(ans,"ai");
    speak(ans);
  };

  recognition.start();
};

</script>

</body>
</html>
