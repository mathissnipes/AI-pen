<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Pen</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

/* ================= GLOBAL ================= */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', sans-serif;
  background: radial-gradient(circle at top, #0b1220, #020617);
  color: white;
  height: 100vh;
  overflow: hidden;
}

/* ================= LOGIN ================= */

.auth-container {
  display: flex;
  height: 100vh;
  justify-content: center;
  align-items: center;
}

.auth-box {
  background: rgba(20,25,45,0.9);
  padding: 40px;
  border-radius: 15px;
  width: 320px;
  text-align: center;
}

.auth-box h2 {
  margin-bottom: 20px;
}

.auth-box input {
  width: 100%;
  margin: 10px 0;
  padding: 12px;
  border-radius: 8px;
  border: none;
  background: #1e293b;
  color: white;
}

.auth-box button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  background: #3b82f6;
  border: none;
  border-radius: 8px;
  color: white;
  cursor: pointer;
}

/* ================= APP ================= */

.app {
  display: none;
  height: 100vh;
}

/* SIDEBAR */

.sidebar {
  width: 260px;
  background: rgba(10,15,30,0.95);
  padding: 20px;
  display: flex;
  flex-direction: column;
}

.sidebar h1 {
  font-size: 18px;
  margin-bottom: 20px;
}

.new-chat {
  padding: 12px;
  background: #3b82f6;
  border: none;
  border-radius: 10px;
  margin-bottom: 20px;
  cursor: pointer;
}

.chat-list {
  flex: 1;
  overflow-y: auto;
}

.chat-item {
  padding: 10px;
  border-radius: 8px;
  margin-bottom: 5px;
  cursor: pointer;
}

.chat-item:hover {
  background: rgba(255,255,255,0.05);
}

/* MAIN */

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* HEADER */

.header {
  padding: 15px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  display: flex;
  justify-content: space-between;
}

/* CHAT AREA */

.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 40px;
}

.message {
  margin-bottom: 15px;
  padding: 14px;
  border-radius: 12px;
  max-width: 70%;
}

.user {
  background: #3b82f6;
  margin-left: auto;
}

.ai {
  background: #1e293b;
}

/* INPUT */

.input-container {
  position: absolute;
  bottom: 20px;
  width: 100%;
  display: flex;
  justify-content: center;
}

.input-box {
  width: 700px;
  display: flex;
  gap: 10px;
}

.input-box input {
  flex: 1;
  padding: 14px;
  border-radius: 10px;
  border: none;
  background: #1e293b;
  color: white;
}

.input-box button {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  background: #3b82f6;
  color: white;
  cursor: pointer;
}

/* RIGHT PANEL */

.right-panel {
  width: 260px;
  background: rgba(10,15,30,0.95);
  padding: 20px;
}

.right-panel h3 {
  margin-bottom: 10px;
}

.tool {
  padding: 8px;
  margin-bottom: 5px;
  border-radius: 6px;
  background: rgba(255,255,255,0.05);
}

.logout {
  cursor: pointer;
  color: #3b82f6;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div class="auth-container" id="auth">
  <div class="auth-box">
    <h2>AI Pen</h2>
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <button onclick="signup()">Sign Up</button>
  </div>
</div>

<!-- APP -->
<div class="app" id="app">

  <div style="display:flex;height:100%">

    <!-- SIDEBAR -->
    <div class="sidebar">
      <h1>AI Pen</h1>
      <button class="new-chat" onclick="newChat()">+ New Chat</button>

      <div class="chat-list" id="chatList"></div>

      <div class="logout" onclick="logout()">Logout</div>
    </div>

    <!-- MAIN -->
    <div class="main">

      <div class="header">
        <div>New Chat</div>
        <div>GPT-3.5 Turbo</div>
      </div>

      <div class="chat-area" id="chat"></div>

      <div class="input-container">
        <div class="input-box">
          <input id="input" placeholder="Ask something...">
          <button onclick="send()">Send</button>
        </div>
      </div>

    </div>

    <!-- RIGHT PANEL -->
    <div class="right-panel">
      <h3>Tools</h3>
      <div class="tool">Grammar</div>
      <div class="tool">Summarize</div>
      <div class="tool">Translate</div>

      <h3 style="margin-top:20px;">History</h3>
      <div id="history"></div>
    </div>

  </div>

</div>

<script>

/* ================= AUTH ================= */

function login() {
  document.getElementById("auth").style.display = "none";
  document.getElementById("app").style.display = "flex";
}

function signup() {
  alert("Signed up (demo)");
}

function logout() {
  location.reload();
}

/* ================= CHAT ================= */

let chats = [];

function newChat() {
  chats.push([]);
  renderChatList();
}

function renderChatList() {
  const list = document.getElementById("chatList");
  list.innerHTML = "";

  chats.forEach((c, i) => {
    const div = document.createElement("div");
    div.className = "chat-item";
    div.innerText = "Chat " + (i + 1);
    div.onclick = () => loadChat(i);
    list.appendChild(div);
  });
}

let currentChat = [];

function loadChat(i) {
  currentChat = chats[i];
  renderChat();
}

function renderChat() {
  const chat = document.getElementById("chat");
  chat.innerHTML = "";

  currentChat.forEach(m => {
    addMessage(m.text, m.type);
  });
}

function addMessage(text, type) {
  const chat = document.getElementById("chat");

  const div = document.createElement("div");
  div.className = "message " + type;
  div.innerText = text;

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

/* ================= SEND ================= */

async function send() {
  const input = document.getElementById("input");
  const msg = input.value;

  if (!msg) return;

  input.value = "";

  addMessage(msg, "user");

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ message: msg })
    });

    const data = await res.json();

    addMessage(data.reply || "No response", "ai");

  } catch (err) {
    addMessage("Connection error", "ai");
  }
}

</script>

</body>
</html>
