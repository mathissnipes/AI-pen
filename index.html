<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Pen</title>

<style>
body{margin:0;font-family:sans-serif;background:#0f172a;color:white;}
#auth{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;}
input{padding:12px;margin:6px;border-radius:8px;border:none;width:260px;}
button{padding:12px;margin:6px;border:none;border-radius:8px;background:#2563eb;color:white;cursor:pointer;}
#app{display:none;height:100vh;}
#logoutBtn{position:fixed;top:10px;right:10px;background:red;}
.msg{margin:5px;padding:10px;border-radius:10px;max-width:70%;}
.user{background:#2563eb;margin-left:auto;}
.ai{background:#1e293b;}
#messages{height:70%;overflow:auto;padding:10px;}
#inputBar{display:flex;padding:10px;}
#inputBar input{flex:1;}
</style>
</head>

<body>

<div id="auth">
  <h2 id="title">Login</h2>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button id="loginBtn">Login</button>
  <button id="signupBtn">Sign Up</button>
</div>

<div id="app">
  <button id="logoutBtn">LOGOUT</button>

  <div id="messages"></div>

  <div id="inputBar">
    <input id="msgInput" placeholder="Type message...">
    <button id="sendBtn">Send</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
/* ====== PUT YOUR KEY HERE ====== */
const API_KEY = "PASTE_YOUR_OPENROUTER_KEY";

/* ===== FIREBASE ===== */
firebase.initializeApp({
  apiKey:"AIzaSyAb9ORZa7EQyKhLf8hL46Qh3FXZmNGzIjg",
  authDomain:"ai-pen-c85a0.firebaseapp.com",
  projectId:"ai-pen-c85a0"
});

const auth = firebase.auth();

/* ===== LOGIN ===== */
loginBtn.onclick = async ()=>{
  try{
    await auth.signInWithEmailAndPassword(email.value,password.value);
  }catch(e){
    alert("Login failed: " + e.message);
  }
};

/* ===== SIGNUP ===== */
signupBtn.onclick = async ()=>{
  try{
    await auth.createUserWithEmailAndPassword(email.value,password.value);
    alert("Account created!");
  }catch(e){
    alert("Signup failed: " + e.message);
  }
};

/* ===== AUTH STATE ===== */
auth.onAuthStateChanged(user=>{
  if(user){
    authDiv(false);
  }else{
    authDiv(true);
  }
});

function authDiv(showAuth){
  document.getElementById("auth").style.display = showAuth ? "flex" : "none";
  document.getElementById("app").style.display = showAuth ? "none" : "block";
}

/* ===== LOGOUT ===== */
logoutBtn.onclick = ()=>auth.signOut();

/* ===== SEND ===== */
sendBtn.onclick = async ()=>{
  const text = msgInput.value;
  if(!text) return;

  addMsg(text,"user");
  msgInput.value="";

  const reply = await askAI(text);
  addMsg(reply,"ai");
};

/* ===== AI ===== */
async function askAI(message){
  try{
    const res = await fetch("https://openrouter.ai/api/v1/chat/completions",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer " + 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
      },
      body: JSON.stringify({
        model:"mistralai/mistral-7b-instruct",
        messages:[{role:"user",content:message}]
      })
    });

    const data = await res.json();

    if(!data.choices){
      return "AI error: " + JSON.stringify(data);
    }

    return data.choices[0].message.content;

  }catch(e){
    return "Error: " + e.message;
  }
}

/* ===== UI ===== */
function addMsg(text,type){
  const d = document.createElement("div");
  d.className="msg " + type;
  d.innerText = text;
  messages.appendChild(d);
}
</script>

</body>
</html>
