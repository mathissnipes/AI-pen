<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Pen</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#0f172a;
  color:white;
}

/* AUTH */
#auth{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
}

input{
  padding:12px;
  margin:6px;
  border-radius:8px;
  border:none;
  width:260px;
}

button{
  padding:12px;
  margin:6px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

/* APP */
#app{
  display:none;
  height:100vh;
}

/* BIG LOGOUT BUTTON */
#logoutBtn{
  position:fixed;
  top:10px;
  right:10px;
  background:red;
  color:white;
  font-weight:bold;
  z-index:9999;
}

/* CHAT */
#messages{
  height:70%;
  overflow:auto;
  padding:10px;
}

.msg{
  padding:10px;
  margin:5px;
  border-radius:10px;
  max-width:70%;
}

.user{ background:#2563eb; margin-left:auto; }
.ai{ background:#1e293b; }

/* INPUT */
#inputBar{
  display:flex;
  padding:10px;
}

#inputBar input{
  flex:1;
}
</style>
</head>

<body>

<!-- AUTH -->
<div id="auth">
  <h2 id="title">Login</h2>

  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <input id="username" placeholder="Username" style="display:none;">

  <button id="mainBtn">Login</button>
  <button id="switchBtn">Switch Mode</button>
</div>

<!-- APP -->
<div id="app">

<button id="logoutBtn">LOGOUT</button>

<div id="messages"></div>

<div id="inputBar">
  <input id="msgInput" placeholder="Type message...">
  <button id="sendBtn">Send</button>
</div>

<button id="micBtn">🎙️ Speak</button>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>

/* Firebase */
firebase.initializeApp({
  apiKey: "AIzaSyAb9ORZa7EQyKhLf8hL46Qh3FXZmNGzIjg",
  authDomain: "ai-pen-c85a0.firebaseapp.com",
  projectId: "ai-pen-c85a0"
});

const auth = firebase.auth();

let signupMode = false;

/* SWITCH */
switchBtn.onclick = ()=>{
  signupMode = !signupMode;

  title.innerText = signupMode ? "Sign Up" : "Login";
  mainBtn.innerText = signupMode ? "Create Account" : "Login";
  username.style.display = signupMode ? "block" : "none";
};

/* LOGIN / SIGNUP */
mainBtn.onclick = async ()=>{
  try{
    if(signupMode){
      await auth.createUserWithEmailAndPassword(email.value,password.value);
    }else{
      await auth.signInWithEmailAndPassword(email.value,password.value);
    }
  }catch(e){
    alert(e.message);
  }
};

/* AUTH STATE */
auth.onAuthStateChanged(user=>{
  if(user){
    auth.style.display="none";
    app.style.display="block";
  }else{
    auth.style.display="flex";
    app.style.display="none";
  }
});

/* LOGOUT (GUARANTEED) */
logoutBtn.onclick = ()=>{
  auth.signOut();
};

/* CHAT */
sendBtn.onclick = ()=>{
  if(!msgInput.value) return;

  addMsg(msgInput.value,"user");
  addMsg("AI: "+msgInput.value,"ai");

  msgInput.value="";
};

function addMsg(text,type){
  let d = document.createElement("div");
  d.className="msg "+type;
  d.innerText=text;
  messages.appendChild(d);
}

/* SPEECH */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const recognition = new SpeechRecognition();

micBtn.onclick = ()=>{
  recognition.start();
};

recognition.onresult = (event)=>{
  const text = event.results[0][0].transcript;

  addMsg(text,"user");

  const reply = "AI: " + text;

  addMsg(reply,"ai");

  const speech = new SpeechSynthesisUtterance(reply);
  window.speechSynthesis.speak(speech);
};

</script>

</body>
</html>
