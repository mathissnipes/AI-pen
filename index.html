<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Pen</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#0f172a;
  color:white;
}

/* AUTH */
#auth{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
}

input{
  padding:12px;
  margin:6px;
  border-radius:8px;
  border:none;
  width:260px;
}

button{
  padding:12px;
  margin:6px;
  border:none;
  border-radius:8px;
  background:#2563eb;
  color:white;
  cursor:pointer;
}

/* APP */
#app{
  display:none;
  height:100vh;
}

/* SIDEBAR */
#sidebar{
  width:250px;
  background:#020617;
  height:100%;
  float:left;
  padding:10px;
}

/* MAIN */
#main{
  margin-left:250px;
  display:flex;
  flex-direction:column;
  height:100%;
}

/* TOP BAR */
#topbar{
  display:flex;
  justify-content:space-between;
  padding:10px;
  border-bottom:1px solid #1e293b;
}

/* CHAT */
#messages{
  flex:1;
  overflow:auto;
  padding:10px;
}

.msg{
  max-width:70%;
  padding:10px;
  margin:6px;
  border-radius:10px;
}

.user{ background:#2563eb; margin-left:auto; }
.ai{ background:#1e293b; }

/* INPUT */
#inputBar{
  display:flex;
  padding:10px;
}

#inputBar input{
  flex:1;
}

/* VOICE */
#voiceBar{
  display:flex;
  justify-content:center;
  padding:10px;
}
</style>
</head>

<body>

<!-- AUTH -->
<div id="auth">
  <h2 id="title">Login</h2>

  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <input id="username" placeholder="Username" style="display:none;">

  <button id="mainBtn">Login</button>
  <button id="switchBtn">Switch Mode</button>
</div>

<!-- APP -->
<div id="app">

<div id="sidebar">
  <button id="newChatBtn">+ New Chat</button>
</div>

<div id="main">

<div id="topbar">
  <span id="userDisplay"></span>
  <button onclick="logout()">Logout</button>
</div>

<div id="messages"></div>

<div id="inputBar">
  <input id="msgInput" placeholder="Type message...">
  <button id="sendBtn">Send</button>
</div>

<div id="voiceBar">
  <button id="micBtn">🎙️ Speak</button>
</div>

</div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>

/* Firebase */
firebase.initializeApp({
  apiKey: "AIzaSyAb9ORZa7EQyKhLf8hL46Qh3FXZmNGzIjg",
  authDomain: "ai-pen-c85a0.firebaseapp.com",
  projectId: "ai-pen-c85a0"
});

const auth = firebase.auth();

let signupMode = false;

/* SWITCH */
switchBtn.onclick = ()=>{
  signupMode = !signupMode;

  title.innerText = signupMode ? "Sign Up" : "Login";
  mainBtn.innerText = signupMode ? "Create Account" : "Login";
  username.style.display = signupMode ? "block" : "none";
};

/* AUTH */
mainBtn.onclick = async ()=>{
  try{
    if(signupMode){
      await auth.createUserWithEmailAndPassword(email.value,password.value);
    }else{
      await auth.signInWithEmailAndPassword(email.value,password.value);
    }
  }catch(e){
    alert(e.message);
  }
};

/* AUTO LOGIN */
auth.onAuthStateChanged(user=>{
  if(user){
    document.getElementById("auth").style.display="none";
    document.getElementById("app").style.display="block";
    userDisplay.innerText = user.email;
  }else{
    document.getElementById("auth").style.display="flex";
    document.getElementById("app").style.display="none";
  }
});

/* LOGOUT */
function logout(){
  auth.signOut();
}

/* CHAT */
sendBtn.onclick = ()=>{
  if(!msgInput.value) return;

  addMsg(msgInput.value,"user");
  addMsg("AI: "+msgInput.value,"ai");

  msgInput.value="";
};

function addMsg(text,type){
  let d = document.createElement("div");
  d.className="msg "+type;
  d.innerText=text;
  messages.appendChild(d);
}

/* SPEECH */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const recognition = new SpeechRecognition();
recognition.lang = "en-GB";

micBtn.onclick = ()=>{
  recognition.start();
  micBtn.innerText = "Listening...";
};

recognition.onresult = (event)=>{
  const text = event.results[0][0].transcript;

  micBtn.innerText = "🎙️ Speak";

  addMsg(text,"user");

  const reply = "AI: " + text;

  addMsg(reply,"ai");

  speak(reply);
};

function speak(text){
  const speech = new SpeechSynthesisUtterance(text);
  speech.lang = "en-GB";
  speech.rate = 1;
  speech.pitch = 1;
  window.speechSynthesis.speak(speech);
}

</script>

</body>
</html>
