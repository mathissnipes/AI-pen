<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Pen</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#0f172a;
  color:white;
}

/* AUTH */
#auth{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
}

input{
  padding:12px;
  margin:6px;
  border-radius:8px;
  border:none;
  width:260px;
}

button{
  padding:12px;
  margin:6px;
  border:none;
  border-radius:8px;
  background:#2563eb;
  color:white;
  cursor:pointer;
}

/* APP */
#app{
  display:none;
  height:100vh;
}

/* BIG LOGOUT */
#logoutBtn{
  position:fixed;
  top:10px;
  right:10px;
  background:red;
  font-weight:bold;
  z-index:9999;
}

/* CHAT */
#messages{
  height:70%;
  overflow:auto;
  padding:10px;
}

.msg{
  padding:10px;
  margin:5px;
  border-radius:10px;
  max-width:70%;
}

.user{ background:#2563eb; margin-left:auto; }
.ai{ background:#1e293b; }

/* INPUT */
#inputBar{
  display:flex;
  padding:10px;
}

#inputBar input{
  flex:1;
}
</style>
</head>

<body>

<!-- AUTH -->
<div id="auth">
  <h2 id="title">Login</h2>

  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <input id="username" placeholder="Username" style="display:none;">

  <button id="mainBtn">Login</button>
  <button id="switchBtn">No account? Sign up</button>
</div>

<!-- APP -->
<div id="app">

<button id="logoutBtn">LOGOUT</button>

<div id="messages"></div>

<div id="inputBar">
  <input id="msgInput" placeholder="Type message...">
  <button id="sendBtn">Send</button>
</div>

<button id="micBtn">🎙️ Speak</button>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyAb9ORZa7EQyKhLf8hL46Qh3FXZmNGzIjg",
  authDomain: "ai-pen-c85a0.firebaseapp.com",
  projectId: "ai-pen-c85a0"
});

const auth = firebase.auth();

let signupMode = false;

/* SWITCH LOGIN / SIGNUP (FIXED TEXT) */
document.getElementById("switchBtn").onclick = ()=>{
  signupMode = !signupMode;

  if(signupMode){
    document.getElementById("title").innerText = "Sign Up";
    document.getElementById("mainBtn").innerText = "Create Account";
    document.getElementById("username").style.display = "block";
    document.getElementById("switchBtn").innerText = "Already have account? Login";
  }else{
    document.getElementById("title").innerText = "Login";
    document.getElementById("mainBtn").innerText = "Login";
    document.getElementById("username").style.display = "none";
    document.getElementById("switchBtn").innerText = "No account? Sign up";
  }
};

/* LOGIN / SIGNUP */
document.getElementById("mainBtn").onclick = async ()=>{
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  try{
    if(signupMode){
      await auth.createUserWithEmailAndPassword(email,password);
    }else{
      await auth.signInWithEmailAndPassword(email,password);
    }
  }catch(e){
    alert(e.message);
  }
};

/* AUTH STATE */
auth.onAuthStateChanged(user=>{
  if(user){
    document.getElementById("auth").style.display="none";
    document.getElementById("app").style.display="block";
  }else{
    document.getElementById("auth").style.display="flex";
    document.getElementById("app").style.display="none";
  }
});

/* LOGOUT */
document.getElementById("logoutBtn").onclick = ()=>{
  auth.signOut();
};

/* CHAT */
document.getElementById("sendBtn").onclick = ()=>{
  const input = document.getElementById("msgInput");
  if(!input.value) return;

  addMsg(input.value,"user");
  addMsg("AI: " + input.value,"ai");

  input.value="";
};

function addMsg(text,type){
  const d = document.createElement("div");
  d.className="msg "+type;
  d.innerText=text;
  document.getElementById("messages").appendChild(d);
}

/* SPEECH */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const recognition = new SpeechRecognition();

document.getElementById("micBtn").onclick = ()=>{
  recognition.start();
};

recognition.onresult = (event)=>{
  const text = event.results[0][0].transcript;

  addMsg(text,"user");

  const reply = "AI: " + text;

  addMsg(reply,"ai");

  const speech = new SpeechSynthesisUtterance(reply);
  window.speechSynthesis.speak(speech);
};
</script>

</body>
</html>
