<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Pen</title>

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:#0f172a;
  color:white;
}

/* AUTH */
#auth{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
}

input{
  padding:12px;
  margin:6px;
  border-radius:8px;
  border:none;
  width:260px;
}

button{
  padding:12px;
  margin:6px;
  border:none;
  border-radius:8px;
  background:#2563eb;
  color:white;
  cursor:pointer;
}

.switch{
  color:#38bdf8;
  cursor:pointer;
}

/* APP */
#app{
  display:none;
  height:100vh;
}

/* Sidebar */
#sidebar{
  width:260px;
  background:#020617;
  height:100%;
  float:left;
  padding:10px;
}

.chatItem{
  padding:10px;
  background:#1e293b;
  margin:5px 0;
  border-radius:8px;
  cursor:pointer;
}

/* Main */
#main{
  margin-left:260px;
  height:100%;
  display:flex;
  flex-direction:column;
}

#top{
  display:flex;
  justify-content:space-between;
  padding:10px;
  border-bottom:1px solid #1e293b;
}

#messages{
  flex:1;
  overflow:auto;
  padding:10px;
}

.msg{
  max-width:70%;
  padding:10px;
  margin:6px;
  border-radius:10px;
}

.user{
  background:#2563eb;
  margin-left:auto;
}

.ai{
  background:#1e293b;
}

#inputBar{
  display:flex;
  padding:10px;
}

#inputBar input{
  flex:1;
}
</style>
</head>

<body>

<!-- AUTH -->
<div id="auth">
  <h2 id="authTitle">Login</h2>

  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <input id="username" placeholder="Username" style="display:none;">

  <button id="authBtn">Login</button>
  <div id="switchText" class="switch">No account? Sign up</div>
</div>

<!-- APP -->
<div id="app">

<div id="sidebar">
  <button id="newChatBtn">+ New Chat</button>
  <div id="chatList"></div>
</div>

<div id="main">

<div id="top">
  <div id="profile"></div>
</div>

<div id="messages"></div>

<div id="inputBar">
  <input id="msgInput" placeholder="Type a message...">
  <button id="sendBtn">Send</button>
</div>

</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, doc, setDoc, query, where } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

/* Firebase */
const firebaseConfig = {
  apiKey: "AIzaSyAb9ORZa7EQyKhLf8hL46Qh3FXZmNGzIjg",
  authDomain: "ai-pen-c85a0.firebaseapp.com",
  projectId: "ai-pen-c85a0"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth();
const db = getFirestore();

let user = null;
let isSignup = false;
let currentChatId = null;

/* SWITCH LOGIN/SIGNUP */
switchText.onclick = ()=>{
  isSignup = !isSignup;

  authTitle.innerText = isSignup ? "Sign Up" : "Login";
  authBtn.innerText = isSignup ? "Create Account" : "Login";
  username.style.display = isSignup ? "block" : "none";

  switchText.innerText = isSignup
    ? "Already have account? Login"
    : "No account? Sign up";
};

/* AUTH */
authBtn.onclick = async ()=>{
  try{
    if(isSignup){
      const res = await createUserWithEmailAndPassword(auth,email.value,password.value);

      await setDoc(doc(db,"users",res.user.uid),{
        username: username.value
      });

    }else{
      await signInWithEmailAndPassword(auth,email.value,password.value);
    }
  }catch(e){
    alert(e.message);
  }
};

/* AUTO LOGIN */
onAuthStateChanged(auth, async u=>{
  if(u){
    user = u;
    auth.style.display="none";
    app.style.display="block";

    profile.innerText = u.email;

    loadChats();
  }
});

/* CREATE CHAT */
newChatBtn.onclick = async ()=>{
  const ref = await addDoc(collection(db,"chats"),{
    uid:user.uid,
    created:Date.now()
  });

  currentChatId = ref.id;
  messages.innerHTML="";
  loadChats();
};

/* LOAD CHATS */
async function loadChats(){
  chatList.innerHTML="";

  const q = query(collection(db,"chats"), where("uid","==",user.uid));
  const snap = await getDocs(q);

  snap.forEach(docSnap=>{
    let div = document.createElement("div");
    div.className="chatItem";
    div.innerText="Chat";

    div.onclick = ()=>{
      currentChatId = docSnap.id;
      loadMessages();
    };

    chatList.appendChild(div);
  });
}

/* LOAD MESSAGES */
async function loadMessages(){
  messages.innerHTML="";

  const snap = await getDocs(collection(db,"chats",currentChatId,"messages"));

  snap.forEach(d=>{
    const m = d.data();
    addMessage(m.text, m.role);
  });
}

/* SEND MESSAGE */
sendBtn.onclick = sendMessage;

async function sendMessage(){
  let text = msgInput.value;
  if(!text || !currentChatId) return;

  addMessage(text,"user");

  await addDoc(collection(db,"chats",currentChatId,"messages"),{
    text,
    role:"user"
  });

  msgInput.value="";

  let reply = "AI: " + text;

  addMessage(reply,"ai");

  await addDoc(collection(db,"chats",currentChatId,"messages"),{
    text:reply,
    role:"ai"
  });
}

/* UI */
function addMessage(text,type){
  let div = document.createElement("div");
  div.className = "msg " + type;
  div.innerText = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

</script>

</body>
</html>
