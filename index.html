<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Pen</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

.center{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
}

#app{ display:none; width:100%; }

input{
  padding:12px;
  margin:6px;
  border-radius:8px;
  border:none;
  width:260px;
}

button{
  padding:10px;
  margin:6px;
  border:none;
  border-radius:8px;
  background:#2563eb;
  color:white;
  cursor:pointer;
}

#chat{
  width:90%;
  max-width:700px;
}

.msg{
  padding:10px;
  margin:5px 0;
  border-radius:10px;
}

.user{ background:#2563eb; }
.ai{ background:#1e293b; }

.topbar{
  display:flex;
  justify-content:flex-end;
  padding:10px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="auth" class="center">
  <h2>AI Pen</h2>

  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button onclick="signup()">Sign Up</button>
  <button onclick="login()">Login</button>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <button onclick="logout()">Logout</button>
  </div>

  <div class="center">
    <div id="chat"></div>

    <input id="msg" placeholder="Ask something...">
    <button onclick="send()">Send</button>
  </div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
/* 🔥 FIREBASE CONFIG */
firebase.initializeApp({
  apiKey:"AIzaSyAb9ORZa7EQyKhLf8hL46Qh3FXZmNGzIjg",
  authDomain:"ai-pen-c85a0.firebaseapp.com",
  projectId:"ai-pen-c85a0"
});

const auth = firebase.auth();

/* 🔐 AUTH FUNCTIONS */
function signup(){
  auth.createUserWithEmailAndPassword(email.value,password.value)
  .then(()=>alert("Account created"))
  .catch(e=>alert(e.message));
}

function login(){
  auth.signInWithEmailAndPassword(email.value,password.value)
  .catch(e=>alert(e.message));
}

function logout(){
  auth.signOut();
}

/* 🔄 AUTH STATE */
auth.onAuthStateChanged(user=>{
  if(user){
    document.getElementById("auth").style.display="none";
    document.getElementById("app").style.display="block";
  }else{
    document.getElementById("auth").style.display="flex";
    document.getElementById("app").style.display="none";
  }
});

/* 💬 CHAT UI */
function add(text,type){
  const div=document.createElement("div");
  div.className="msg "+type;
  div.innerText=text;
  chat.appendChild(div);
}

/* 🚀 SEND MESSAGE */
async function send(){
  const text=msg.value;
  if(!text) return;

  add(text,"user");
  msg.value="";

  const reply = await askAI(text);
  add(reply,"ai");
}

/* 🤖 CALL BACKEND */
async function askAI(message){
  try{
    const res = await fetch("https://ai-pen-alpha.vercel.app/api/chat", {
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body: JSON.stringify({ message })
    });

    const data = await res.json();

    if(!data.choices){
      return "ERROR: " + JSON.stringify(data);
    }

    return data.choices[0].message.content;

  }catch(e){
    return "Connection error";
  }
}
</script>

</body>
</html>
