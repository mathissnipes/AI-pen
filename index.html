<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Pen</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#0f172a;
  color:white;
}

/* AUTH */
#auth{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
}

input{
  padding:12px;
  margin:6px;
  border-radius:8px;
  border:none;
  width:260px;
}

button{
  padding:12px;
  margin:6px;
  border:none;
  border-radius:8px;
  background:#2563eb;
  color:white;
  cursor:pointer;
}

.switch{
  color:#38bdf8;
  cursor:pointer;
}

/* APP */
#app{
  display:none;
  height:100vh;
}

#messages{
  height:80%;
  overflow:auto;
  padding:10px;
}

.msg{
  margin:8px;
  padding:10px;
  border-radius:10px;
  max-width:70%;
}

.user{ background:#2563eb; margin-left:auto; }
.ai{ background:#1e293b; }

#inputBar{
  display:flex;
}

#inputBar input{
  flex:1;
}
</style>
</head>

<body>

<!-- AUTH -->
<div id="auth">
  <h2 id="title">Login</h2>

  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <input id="username" placeholder="Username" style="display:none;">

  <button id="mainBtn">Login</button>
  <div id="switchBtn" class="switch">No account? Sign up</div>
</div>

<!-- APP -->
<div id="app">
  <div id="messages"></div>

  <div id="inputBar">
    <input id="msgInput" placeholder="Type...">
    <button id="sendBtn">Send</button>
  </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

/* Firebase */
const firebaseConfig = {
  apiKey: "AIzaSyAb9ORZa7EQyKhLf8hL46Qh3FXZmNGzIjg",
  authDomain: "ai-pen-c85a0.firebaseapp.com",
  projectId: "ai-pen-c85a0"
};

const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth();
const db = getFirestore();

/* MODE */
let signupMode = false;

const authDiv = document.getElementById("auth");
const appDiv = document.getElementById("app");

/* SWITCH */
switchBtn.onclick = ()=>{
  signupMode = !signupMode;

  title.innerText = signupMode ? "Sign Up" : "Login";
  mainBtn.innerText = signupMode ? "Create Account" : "Login";
  username.style.display = signupMode ? "block" : "none";

  switchBtn.innerText = signupMode
    ? "Already have account? Login"
    : "No account? Sign up";
};

/* AUTH ACTION */
mainBtn.onclick = async ()=>{
  try{
    if(signupMode){
      const res = await createUserWithEmailAndPassword(auth,email.value,password.value);

      await setDoc(doc(db,"users",res.user.uid),{
        username: username.value
      });

    }else{
      await signInWithEmailAndPassword(auth,email.value,password.value);
    }
  }catch(e){
    alert(e.message);
  }
};

/* AUTO LOGIN */
onAuthStateChanged(auth, user=>{
  if(user){
    authDiv.style.display="none";
    appDiv.style.display="block";
  }
});

/* CHAT */
sendBtn.onclick = ()=>{
  if(!msgInput.value) return;

  addMsg(msgInput.value,"user");
  addMsg("AI: "+msgInput.value,"ai");

  msgInput.value="";
};

function addMsg(text,type){
  let d = document.createElement("div");
  d.className="msg "+type;
  d.innerText=text;
  messages.appendChild(d);
}

</script>

</body>
</html>
