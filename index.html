<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Pen</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}

#auth, #app {
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
}

#app { display:none; }

input {
  padding:12px;
  margin:6px;
  border-radius:8px;
  border:none;
  width:260px;
}

button {
  padding:12px;
  margin:6px;
  border:none;
  border-radius:8px;
  background:#2563eb;
  color:white;
  cursor:pointer;
}

#messages {
  max-height:300px;
  overflow:auto;
  width:90%;
}

.msg {
  padding:10px;
  margin:5px;
  border-radius:10px;
}

.user { background:#2563eb; }
.ai { background:#1e293b; }
</style>
</head>

<body>

<!-- LOGIN -->
<div id="auth">
  <h2>AI Pen Login</h2>

  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button onclick="signup()">Sign Up</button>
  <button onclick="login()">Login</button>
</div>

<!-- APP -->
<div id="app">
  <button onclick="logout()">Logout</button>

  <div id="messages"></div>

  <input id="msgInput" placeholder="Ask something...">
  <button onclick="send()">Send</button>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
/* ===== PUT YOUR KEY HERE ===== */
const API_KEY = "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";

/* ===== FIREBASE ===== */
firebase.initializeApp({
  apiKey:"AIzaSyAb9ORZa7EQyKhLf8hL46Qh3FXZmNGzIjg",
  authDomain:"ai-pen-c85a0.firebaseapp.com",
  projectId:"ai-pen-c85a0"
});

const auth = firebase.auth();

/* ===== SIGNUP ===== */
function signup(){
  auth.createUserWithEmailAndPassword(email.value, password.value)
  .then(()=>alert("Account created"))
  .catch(e=>alert(e.code));
}

/* ===== LOGIN ===== */
function login(){
  auth.signInWithEmailAndPassword(email.value, password.value)
  .catch(e=>alert(e.code));
}

/* ===== LOGOUT ===== */
function logout(){
  auth.signOut();
}

/* ===== STATE ===== */
auth.onAuthStateChanged(user=>{
  if(user){
    document.getElementById("auth").style.display="none";
    document.getElementById("app").style.display="flex";
  }else{
    document.getElementById("auth").style.display="flex";
    document.getElementById("app").style.display="none";
  }
});

/* ===== SEND ===== */
function send(){
  const text = msgInput.value;
  if(!text) return;

  add(text,"user");
  msgInput.value="";

  askAI(text).then(reply=>{
    add(reply,"ai");
  });
}

/* ===== AI ===== */
async function askAI(message){
  try{
    const res = await fetch("https://openrouter.ai/api/v1/chat/completions",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer " + API_KEY
      },
      body: JSON.stringify({
        model:"mistralai/mistral-7b-instruct",
        messages:[{role:"user",content:message}]
      })
    });

    const data = await res.json();

    if(!data.choices){
      return "AI error";
    }

    return data.choices[0].message.content;

  }catch(e){
    return "Connection error";
  }
}

/* ===== UI ===== */
function add(text,type){
  const d = document.createElement("div");
  d.className = "msg " + type;
  d.innerText = text;
  messages.appendChild(d);
}
</script>

</body>
</html>
