<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AI Pen</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0c10;
  color:white;
  text-align:center;
}

.container{
  max-width:400px;
  margin:auto;
  padding:20px;
}

input,button{
  width:90%;
  padding:10px;
  margin:5px;
  border-radius:6px;
  border:none;
}

.chat{
  height:60vh;
  overflow:auto;
  text-align:left;
}

.msg{
  padding:10px;
  margin:8px;
  border-radius:10px;
}

.user{background:#007aff;}
.ai{background:#222;}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->
<div id="login">
  <h2>AI Pen</h2>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button id="loginBtn">Login</button>
  <button id="signupBtn">Sign Up</button>
</div>

<!-- APP -->
<div id="app" style="display:none;">
  <h2>AI Pen</h2>
  <div id="chat" class="chat"></div>
  <button id="mic">🎙️ Talk</button>
  <button id="logoutBtn">Logout</button>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

/* 🔥 YOUR FIREBASE CONFIG (already correct) */
const firebaseConfig = {
  apiKey: "AIzaSyAb9ORZa7EQyKhLf8hL46Qh3FXZmNGzIjg",
  authDomain: "ai-pen-c85a0.firebaseapp.com",
  projectId: "ai-pen-c85a0",
  storageBucket: "ai-pen-c85a0.firebasestorage.app",
  messagingSenderId: "997852271146",
  appId: "1:997852271146:web:f9b42d91dce0ead0d86953"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth();
const db = getFirestore();

let user = null;

/* UI */
const loginDiv = document.getElementById("login");
const appDiv = document.getElementById("app");
const chat = document.getElementById("chat");

/* BUTTONS (IMPORTANT FIX) */
document.getElementById("loginBtn").addEventListener("click", login);
document.getElementById("signupBtn").addEventListener("click", signup);
document.getElementById("logoutBtn").addEventListener("click", logout);

/* LOGIN */
async function login(){
  try{
    const email = document.getElementById("email").value;
    const pass = document.getElementById("password").value;

    const res = await signInWithEmailAndPassword(auth,email,pass);
    user = res.user;
    startApp();

  }catch(e){
    alert(e.message);
  }
}

/* SIGNUP */
async function signup(){
  try{
    const email = document.getElementById("email").value;
    const pass = document.getElementById("password").value;

    const res = await createUserWithEmailAndPassword(auth,email,pass);
    user = res.user;
    startApp();

  }catch(e){
    alert(e.message);
  }
}

/* LOGOUT */
async function logout(){
  await signOut(auth);
  location.reload();
}

/* START APP */
async function startApp(){
  loginDiv.style.display = "none";
  appDiv.style.display = "block";
  loadMessages();
}

/* LOAD CHAT */
async function loadMessages(){
  chat.innerHTML = "";

  const snap = await getDocs(collection(db,"users",user.uid,"chat"));

  snap.forEach(doc=>{
    const d = doc.data();
    addMessage(d.text, d.role==="user");
  });
}

/* SAVE */
async function save(text,role){
  await addDoc(collection(db,"users",user.uid,"chat"),{
    text, role
  });
}

/* UI MESSAGE */
function addMessage(text,isUser){
  const div = document.createElement("div");
  div.className = "msg " + (isUser?"user":"ai");
  div.innerText = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

/* MIC */
document.getElementById("mic").addEventListener("click", ()=>{
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const recognition = new SR();

  recognition.onresult = async (e)=>{
    let text = e.results[0][0].transcript;

    addMessage(text,true);
    save(text,"user");

    let res = await fetch("https://fortunate-enraged-lines--mathischui.replit.app/ask",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({question:text})
    });

    let data = await res.json();
    let ans = data.choices?.[0]?.message?.content || "No answer";

    addMessage(ans,false);
    save(ans,"ai");
  };

  recognition.start();
});

</script>

</body>
</html>
