<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Pen</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#0f172a;
  color:white;
}

#auth{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
}

input{
  padding:12px;
  margin:6px;
  border-radius:8px;
  border:none;
  width:260px;
}

button{
  padding:12px;
  margin:6px;
  border:none;
  border-radius:8px;
  background:#2563eb;
  color:white;
  cursor:pointer;
}

#app{
  display:none;
  padding:20px;
}
</style>
</head>

<body>

<div id="auth">
  <h2 id="title">Login</h2>

  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <input id="username" placeholder="Username" style="display:none;">

  <button id="mainBtn">Login</button>
  <button id="toggleBtn">Switch Mode</button>
</div>

<div id="app">
  <h2>Logged in 🎉</h2>
</div>

<!-- Firebase (NON MODULE VERSION) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
console.log("Script loaded ✅");

/* Firebase */
firebase.initializeApp({
  apiKey: "AIzaSyAb9ORZa7EQyKhLf8hL46Qh3FXZmNGzIjg",
  authDomain: "ai-pen-c85a0.firebaseapp.com",
  projectId: "ai-pen-c85a0"
});

const auth = firebase.auth();
const db = firebase.firestore();

let signupMode = false;

/* Buttons */
const mainBtn = document.getElementById("mainBtn");
const toggleBtn = document.getElementById("toggleBtn");

/* Switch mode */
toggleBtn.onclick = ()=>{
  signupMode = !signupMode;

  document.getElementById("title").innerText = signupMode ? "Sign Up" : "Login";
  document.getElementById("username").style.display = signupMode ? "block" : "none";
  mainBtn.innerText = signupMode ? "Create Account" : "Login";
};

/* Main action */
mainBtn.onclick = async ()=>{
  console.log("Button clicked 🔥");

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const username = document.getElementById("username").value;

  try{
    if(signupMode){
      const res = await auth.createUserWithEmailAndPassword(email,password);

      await db.collection("users").doc(res.user.uid).set({
        username: username
      });

      alert("Account created!");
    }else{
      await auth.signInWithEmailAndPassword(email,password);
      alert("Logged in!");
    }
  }catch(e){
    console.error(e);
    alert(e.message);
  }
};

/* Auto login */
auth.onAuthStateChanged(user=>{
  if(user){
    document.getElementById("auth").style.display="none";
    document.getElementById("app").style.display="block";
  }
});
</script>

</body>
</html>
