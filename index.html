<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Pen</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

/* LOGIN */
#auth {
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
}

input {
  padding:12px;
  margin:8px;
  border-radius:8px;
  border:none;
  width:250px;
}

button {
  padding:12px;
  margin:5px;
  border:none;
  border-radius:8px;
  background:#2563eb;
  color:white;
  cursor:pointer;
}

/* APP */
#app {
  display:none;
  height:100vh;
}

#sidebar {
  width:250px;
  background:#020617;
  height:100%;
  overflow:auto;
  float:left;
}

#chatArea {
  margin-left:250px;
  height:100%;
  display:flex;
  flex-direction:column;
}

#messages {
  flex:1;
  overflow:auto;
  padding:10px;
}

.msg {
  margin:10px;
  padding:10px;
  border-radius:10px;
  max-width:70%;
}

.user {
  background:#2563eb;
  margin-left:auto;
}

.ai {
  background:#1e293b;
}

#inputBar {
  display:flex;
}

#inputBar input {
  flex:1;
}

.chatItem {
  padding:10px;
  border-bottom:1px solid #1e293b;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="auth">
  <h2>AI Pen</h2>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button id="loginBtn">Login</button>
  <button id="signupBtn">Sign Up</button>
</div>

<!-- APP -->
<div id="app">
  <div id="sidebar">
    <button id="newChatBtn">+ New Chat</button>
    <div id="chatList"></div>
  </div>

  <div id="chatArea">
    <div id="messages"></div>
    <div id="inputBar">
      <input id="msgInput" placeholder="Type a message...">
      <button id="sendBtn">Send</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAb9ORZa7EQyKhLf8hL46Qh3FXZmNGzIjg",
  authDomain: "ai-pen-c85a0.firebaseapp.com",
  projectId: "ai-pen-c85a0"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth();
const db = getFirestore();

let currentUser = null;
let currentChat = [];

/* AUTH */
loginBtn.onclick = async ()=>{
  await signInWithEmailAndPassword(auth, email.value, password.value);
};

signupBtn.onclick = async ()=>{
  await createUserWithEmailAndPassword(auth, email.value, password.value);
};

onAuthStateChanged(auth, user=>{
  if(user){
    currentUser = user;
    auth.style.display="none";
    app.style.display="block";
    loadChats();
  }
});

/* CHAT UI */
sendBtn.onclick = sendMessage;

msgInput.addEventListener("keypress", e=>{
  if(e.key==="Enter") sendMessage();
});

function addMessage(text, type){
  let div = document.createElement("div");
  div.className = "msg " + type;
  div.innerText = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

/* SIMPLE AI */
function fakeAI(text){
  return "AI: " + text;
}

/* SEND */
async function sendMessage(){
  let text = msgInput.value;
  if(!text) return;

  addMessage(text,"user");
  currentChat.push({role:"user",text});

  msgInput.value="";

  let reply = fakeAI(text);

  addMessage(reply,"ai");
  currentChat.push({role:"ai",text:reply});
}

/* SAVE CHAT */
newChatBtn.onclick = async ()=>{
  if(currentChat.length===0) return;

  await addDoc(collection(db,"chats"),{
    uid: currentUser.uid,
    messages: currentChat,
    created: Date.now()
  });

  currentChat = [];
  messages.innerHTML="";
  loadChats();
};

/* LOAD CHATS */
async function loadChats(){
  chatList.innerHTML="";
  const q = query(collection(db,"chats"), where("uid","==",currentUser.uid));
  const snap = await getDocs(q);

  snap.forEach(doc=>{
    let item = document.createElement("div");
    item.className="chatItem";
    item.innerText="Chat";

    item.onclick = ()=>{
      messages.innerHTML="";
      doc.data().messages.forEach(m=>{
        addMessage(m.text, m.role==="user"?"user":"ai");
      });
    };

    chatList.appendChild(item);
  });
}
</script>

</body>
</html>
