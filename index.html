<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Pen</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:sans-serif;background:#0f172a;color:white;}
#auth{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;}
#app{display:none;padding:20px;}
input{padding:12px;margin:6px;border-radius:8px;border:none;width:250px;}
button{padding:12px;margin:6px;border:none;border-radius:8px;background:#2563eb;color:white;cursor:pointer;}
#messages{margin-top:20px;}
.msg{margin:5px;padding:10px;border-radius:10px;}
.user{background:#2563eb;}
.ai{background:#1e293b;}
</style>

</head>

<body>

<!-- AUTH -->
<div id="auth">
  <h2>Login / Sign Up</h2>

  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button id="signupBtn">Sign Up</button>
  <button id="loginBtn">Login</button>
</div>

<!-- APP -->
<div id="app">
  <button id="logoutBtn">Logout</button>

  <div id="messages"></div>

  <input id="msgInput" placeholder="Ask something...">
  <button id="sendBtn">Send</button>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
/* ===== PUT YOUR KEY HERE ===== */
const API_KEY = "PASTE_OPENROUTER_KEY";

/* ===== FIREBASE ===== */
firebase.initializeApp({
  apiKey:"AIzaSyAb9ORZa7EQyKhLf8hL46Qh3FXZmNGzIjg",
  authDomain:"ai-pen-c85a0.firebaseapp.com",
  projectId:"ai-pen-c85a0"
});

const auth = firebase.auth();

/* ===== SIGN UP ===== */
signupBtn.onclick = async ()=>{
  try{
    await auth.createUserWithEmailAndPassword(email.value,password.value);
    alert("Account created!");
  }catch(e){
    alert(e.code);
  }
};

/* ===== LOGIN ===== */
loginBtn.onclick = async ()=>{
  try{
    await auth.signInWithEmailAndPassword(email.value,password.value);
  }catch(e){
    alert(e.code);
  }
};

/* ===== AUTH STATE ===== */
auth.onAuthStateChanged(user=>{
  if(user){
    authDiv(false);
  }else{
    authDiv(true);
  }
});

function authDiv(show){
  document.getElementById("auth").style.display = show ? "flex" : "none";
  document.getElementById("app").style.display = show ? "none" : "block";
}

/* ===== LOGOUT ===== */
logoutBtn.onclick = ()=>auth.signOut();

/* ===== SEND ===== */
sendBtn.onclick = sendMessage;

async function sendMessage(){
  const text = msgInput.value;
  if(!text) return;

  addMsg(text,"user");
  msgInput.value="";

  const reply = await askAI(text);
  addMsg(reply,"ai");
}

/* ===== AI ===== */
async function askAI(message){
  try{
    const res = await fetch("https://openrouter.ai/api/v1/chat/completions",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer " + API_KEY
      },
      body: JSON.stringify({
        model:"mistralai/mistral-7b-instruct",
        messages:[{role:"user",content:message}]
      })
    });

    const data = await res.json();

    if(!data.choices){
      return "AI error: " + JSON.stringify(data);
    }

    return data.choices[0].message.content;

  }catch(e){
    return "Error: " + e.message;
  }
}

/* ===== UI ===== */
function addMsg(text,type){
  const d = document.createElement("div");
  d.className = "msg " + type;
  d.innerText = text;
  messages.appendChild(d);
}
</script>

</body>
</html>
