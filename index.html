<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AI Pen</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin:0;
  font-family:-apple-system, BlinkMacSystemFont, sans-serif;
  background:#0b0c10;
  color:white;
}

.app {
  max-width:420px;
  margin:auto;
  height:100vh;
  display:flex;
  flex-direction:column;
  padding:16px;
}

.header {
  text-align:center;
}

.status {
  font-size:12px;
  color:#aaa;
  margin-bottom:10px;
}

.chat {
  flex:1;
  overflow-y:auto;
  padding:10px 0;
}

.msg {
  max-width:70%;
  padding:12px;
  border-radius:18px;
  margin-bottom:10px;
  font-size:14px;
  line-height:1.4;
}

.user {
  background:#007aff;
  margin-left:auto;
}

.ai {
  background:#1c1c1e;
}

.micWrap {
  display:flex;
  justify-content:center;
  padding:10px;
}

.mic {
  width:80px;
  height:80px;
  border-radius:50%;
  border:none;
  font-size:28px;
  background:#007aff;
  color:white;
}

.mic.active {
  background:red;
}
</style>
</head>

<body>

<div class="app">

<div class="header">
  <h2>🖊️ AI Pen</h2>
  <div id="status" class="status">Tap and speak</div>
</div>

<div id="chat" class="chat"></div>

<div class="micWrap">
  <button id="mic" class="mic">🎙️</button>
</div>

</div>

<script>
let recognition;
let history = [];
let isListening = false;

const mic = document.getElementById("mic");
const status = document.getElementById("status");
const chat = document.getElementById("chat");

/* Add message */
function addMessage(text, user=false){
  let div = document.createElement("div");
  div.className = "msg " + (user ? "user" : "ai");
  div.innerText = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

/* Speak */
function speak(text){
  speechSynthesis.cancel();
  let s = new SpeechSynthesisUtterance(text);
  s.rate = 0.95;
  speechSynthesis.speak(s);
}

/* Smarter follow-up */
function getFollowUp(question){
  const q = question.toLowerCase();

  if(q.includes("what") || q.includes("explain")){
    return "Want a simpler version?";
  }

  if(q.includes("how")){
    return "Want step-by-step help?";
  }

  if(q.includes("why")){
    return "Want an example?";
  }

  return "";
}

/* Setup mic once */
function setupMic(){
  if(recognition) return;

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    alert("Use Chrome");
    return;
  }

  recognition = new SR();
  recognition.lang = "en-GB";

  recognition.onstart = ()=>{
    status.innerText = "Listening...";
    mic.classList.add("active");
  };

  recognition.onresult = async (e)=>{
    let text = e.results[0][0].transcript;

    addMessage(text, true);
    history.push({role:"user", content:text});

    await askAI(text);
  };

  recognition.onend = ()=>{
    isListening = false;
    mic.classList.remove("active");
    status.innerText = "Tap and speak";
  };
}

/* Start mic */
function startListening(){
  setupMic();

  if(isListening) return;

  try {
    recognition.start();
    isListening = true;
  } catch(e){}
}

/* AI */
async function askAI(question){
  status.innerText = "Thinking...";
  let el = addMessage("...", false);

  try{
    let res = await fetch("https://fortunate-enraged-lines--mathischui.replit.app/ask",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        notes: JSON.stringify(history),
        question: question
      })
    });

    let data = await res.json();
    let ans = data.choices?.[0]?.message?.content || "No answer";

    // 🔥 shorten answer
    ans = ans.split(".").slice(0,2).join(".") + ".";

    // 🔥 better follow-up
    let follow = getFollowUp(question);
    if(follow) ans += "\n\n👉 " + follow;

    el.innerText = ans;
    history.push({role:"assistant", content:ans});

    speak(ans);
    status.innerText = "Tap and speak";

  } catch {
    el.innerText = "Error";
  }
}

mic.onclick = startListening;
</script>

</body>
</html>
