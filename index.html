<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Pen</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#0f172a;
  color:white;
}

/* AUTH */
#auth{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
}

input{
  padding:12px;
  margin:6px;
  border-radius:8px;
  border:none;
  width:260px;
}

button{
  padding:12px;
  margin:6px;
  border:none;
  border-radius:8px;
  background:#2563eb;
  color:white;
  cursor:pointer;
}

.switch{
  color:#38bdf8;
  cursor:pointer;
}

/* APP */
#app{
  display:none;
  height:100vh;
}

#topbar{
  display:flex;
  justify-content:space-between;
  padding:10px;
  background:#020617;
}

/* SETTINGS MENU */
#settingsMenu{
  position:absolute;
  top:50px;
  right:10px;
  background:#1e293b;
  padding:10px;
  border-radius:8px;
  display:none;
}

/* CHAT */
#messages{
  height:70%;
  overflow:auto;
  padding:10px;
}

.msg{
  margin:8px;
  padding:10px;
  border-radius:10px;
  max-width:70%;
}

.user{ background:#2563eb; margin-left:auto; }
.ai{ background:#1e293b; }

#controls{
  display:flex;
  justify-content:center;
  gap:10px;
  padding:10px;
}
</style>
</head>

<body>

<!-- AUTH -->
<div id="auth">
  <h2 id="title">Login</h2>

  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <input id="username" placeholder="Username" style="display:none;">

  <button id="mainBtn">Login</button>
  <div id="switchBtn" class="switch">No account? Sign up</div>
</div>

<!-- APP -->
<div id="app">

<div id="topbar">
  <span>AI Pen</span>
  <button id="settingsBtn">⚙️</button>
</div>

<div id="settingsMenu">
  <button id="logoutBtn">Logout</button>
</div>

<div id="messages"></div>

<div id="controls">
  <button id="micBtn">🎙️ Speak</button>
</div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>

/* Firebase */
firebase.initializeApp({
  apiKey: "AIzaSyAb9ORZa7EQyKhLf8hL46Qh3FXZmNGzIjg",
  authDomain: "ai-pen-c85a0.firebaseapp.com",
  projectId: "ai-pen-c85a0"
});

const auth = firebase.auth();
const db = firebase.firestore();

let signupMode = false;

/* SWITCH LOGIN/SIGNUP */
switchBtn.onclick = ()=>{
  signupMode = !signupMode;

  title.innerText = signupMode ? "Sign Up" : "Login";
  mainBtn.innerText = signupMode ? "Create Account" : "Login";
  username.style.display = signupMode ? "block" : "none";

  switchBtn.innerText = signupMode
    ? "Already have account? Login"
    : "No account? Sign up";
};

/* LOGIN / SIGNUP */
mainBtn.onclick = async ()=>{
  try{
    if(signupMode){
      const res = await auth.createUserWithEmailAndPassword(email.value,password.value);

      await db.collection("users").doc(res.user.uid).set({
        username: username.value
      });

    }else{
      await auth.signInWithEmailAndPassword(email.value,password.value);
    }
  }catch(e){
    alert(e.message);
  }
};

/* AUTO LOGIN */
auth.onAuthStateChanged(user=>{
  if(user){
    auth.style.display="none";
    app.style.display="block";
  }else{
    auth.style.display="flex";
    app.style.display="none";
  }
});

/* SETTINGS */
settingsBtn.onclick = ()=>{
  settingsMenu.style.display =
    settingsMenu.style.display === "block" ? "none" : "block";
};

/* LOGOUT */
logoutBtn.onclick = async ()=>{
  await auth.signOut();
};

/* CHAT UI */
function addMessage(text,type){
  const div = document.createElement("div");
  div.className="msg "+type;
  div.innerText=text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

/* SPEECH */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

const recognition = new SpeechRecognition();
recognition.lang = "en-GB";

/* MIC BUTTON */
micBtn.onclick = ()=>{
  recognition.start();
  micBtn.innerText = "Listening...";
};

/* RESULT */
recognition.onresult = (event)=>{
  const text = event.results[0][0].transcript;

  micBtn.innerText = "🎙️ Speak";

  addMessage(text,"user");

  const reply = "AI: " + text;

  addMessage(reply,"ai");

  speak(reply);
};

/* TEXT TO SPEECH */
function speak(text){
  const speech = new SpeechSynthesisUtterance(text);
  speech.lang = "en-GB";
  window.speechSynthesis.speak(speech);
}

</script>

</body>
</html>
