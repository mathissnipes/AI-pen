<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Pen</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg,#020617,#0f172a);
  color: white;
}

/* LOGIN */
#loginPage {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.login-box {
  background: #0f172a;
  padding: 30px;
  border-radius: 12px;
  width: 300px;
  text-align: center;
}

input {
  width: 100%;
  padding: 10px;
  margin: 10px 0;
  border-radius: 8px;
  border: none;
}

button {
  padding: 10px;
  width: 100%;
  background: #3b82f6;
  border: none;
  border-radius: 8px;
  color: white;
  cursor: pointer;
}

/* APP */
#app {
  display: none;
  height: 100vh;
}

.sidebar {
  width: 220px;
  background: #020617;
  padding: 20px;
}

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.container {
  display: flex;
  height: 100%;
}

.chat {
  padding: 20px;
  overflow-y: auto;
}

.message {
  margin: 10px 0;
  padding: 12px;
  border-radius: 10px;
  max-width: 60%;
}

.user {
  background: #3b82f6;
  margin-left: auto;
}

.ai {
  background: #1e293b;
}

.input-box {
  display: flex;
  padding: 20px;
  gap: 10px;
}

.input-box input {
  flex: 1;
}

.logout {
  position: absolute;
  top: 10px;
  right: 10px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage">
  <div class="login-box">
    <h2>AI Pen</h2>
    <input id="email" placeholder="Email"/>
    <input id="password" type="password" placeholder="Password"/>
    <button onclick="login()">Login</button>
    <button onclick="signup()">Sign Up</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <button class="logout" onclick="logout()">Logout</button>

  <div class="container">
    <div class="sidebar">
      <h3>AI Pen</h3>
      <button onclick="clearChat()">+ New Chat</button>
    </div>

    <div class="main">
      <div class="chat" id="chat"></div>

      <div class="input-box">
        <input id="input" placeholder="Ask something..."/>
        <button onclick="send()">Send</button>
      </div>
    </div>
  </div>
</div>

<script>
// SIMPLE LOGIN (local storage for now)
function login() {
  const email = document.getElementById("email").value;
  const pass = document.getElementById("password").value;

  if (email && pass) {
    localStorage.setItem("user", email);
    showApp();
  }
}

function signup() {
  alert("Signup simulated 👍");
  login();
}

function logout() {
  localStorage.removeItem("user");
  location.reload();
}

function showApp() {
  document.getElementById("loginPage").style.display = "none";
  document.getElementById("app").style.display = "block";
}

// AUTO LOGIN
if (localStorage.getItem("user")) {
  showApp();
}

// CHAT
function addMessage(type, text) {
  const chat = document.getElementById("chat");
  const div = document.createElement("div");
  div.className = "message " + type;
  div.innerText = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function clearChat() {
  document.getElementById("chat").innerHTML = "";
}

async function send() {
  const input = document.getElementById("input");
  const message = input.value;
  if (!message) return;

  addMessage("user", message);
  input.value = "";

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ message })
    });

    const data = await res.json();

    if (data.reply) {
      addMessage("ai", data.reply);
    } else {
      addMessage("ai", "Error: " + data.error);
    }

  } catch (err) {
    addMessage("ai", "Connection error");
  }
}
</script>

</body>
</html>
