<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Pen</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:sans-serif;background:#0f172a;color:white;}
#auth{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;}
input{padding:12px;margin:6px;border-radius:8px;border:none;width:260px;}
button{padding:12px;margin:6px;border:none;border-radius:8px;background:#2563eb;color:white;cursor:pointer;}
#app{display:none;}
#logoutBtn{position:fixed;top:10px;right:10px;background:red;}
.msg{margin:5px;padding:10px;border-radius:10px;max-width:70%;}
.user{background:#2563eb;margin-left:auto;}
.ai{background:#1e293b;}
</style>

</head>

<body>

<div id="auth">
  <h2 id="title">Login</h2>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <input id="username" placeholder="Username" style="display:none;">
  <button id="mainBtn">Login</button>
  <button id="switchBtn">No account? Sign up</button>
</div>

<div id="app">
<button id="logoutBtn">LOGOUT</button>

<div id="messages"></div>

<input id="msgInput" placeholder="Type or speak...">
<button id="sendBtn">Send</button>
<button id="micBtn">🎙️ Speak</button>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>

firebase.initializeApp({
  apiKey:"AIzaSyAb9ORZa7EQyKhLf8hL46Qh3FXZmNGzIjg",
  authDomain:"ai-pen-c85a0.firebaseapp.com",
  projectId:"ai-pen-c85a0"
});

const auth = firebase.auth();
let signupMode=false;

switchBtn.onclick=()=>{
  signupMode=!signupMode;
  title.innerText=signupMode?"Sign Up":"Login";
  mainBtn.innerText=signupMode?"Create Account":"Login";
  username.style.display=signupMode?"block":"none";
  switchBtn.innerText=signupMode?"Already have account? Login":"No account? Sign up";
};

mainBtn.onclick=async()=>{
  try{
    if(signupMode){
      await auth.createUserWithEmailAndPassword(email.value,password.value);
    }else{
      await auth.signInWithEmailAndPassword(email.value,password.value);
    }
  }catch(e){
    alert(e.message);
  }
};

auth.onAuthStateChanged(user=>{
  if(user){
    auth.style.display="none";
    app.style.display="block";
  }else{
    auth.style.display="flex";
    app.style.display="none";
  }
});

logoutBtn.onclick=()=>auth.signOut();

/* CHAT */
sendBtn.onclick=sendMessage;

async function sendMessage(){
  const text=msgInput.value;
  if(!text) return;

  addMsg(text,"user");
  msgInput.value="";

  const reply=await askAI(text);
  addMsg(reply,"ai");
}

/* DEBUG AI */
async function askAI(message){
  try{
    console.log("Sending:",message);

    const res=await fetch("https://openrouter.ai/api/v1/chat/completions",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer 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"
      },
      body:JSON.stringify({
        model:"mistralai/mistral-7b-instruct",
        messages:[{role:"user",content:message}]
      })
    });

    const data=await res.json();

    console.log("AI Response:",data);

    if(!data.choices){
      return "⚠️ AI ERROR: "+JSON.stringify(data);
    }

    return data.choices[0].message.content;

  }catch(e){
    console.error(e);
    return "❌ ERROR: "+e.message;
  }
}

/* UI */
function addMsg(text,type){
  const d=document.createElement("div");
  d.className="msg "+type;
  d.innerText=text;
  messages.appendChild(d);
}

/* SPEECH */
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
const recognition=new SpeechRecognition();

micBtn.onclick=()=>recognition.start();

recognition.onresult=async(e)=>{
  const text=e.results[0][0].transcript;
  addMsg(text,"user");
  const reply=await askAI(text);
  addMsg(reply,"ai");
};

</script>

</body>
</html>
